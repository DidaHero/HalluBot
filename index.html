const PUNCT = new Set([".",",","!","?",";",":"]);
const STOP = new Set(["der","die","das","ein","eine","einer","eines","und","oder","aber","ist","sind","war","wird","werden","zu","zum","zur","von","vom","im","in","auf","mit","für","bei","als","auch","man","sich","des","den","dem","wie","was","warum","wann","wo","wer","welche","welcher","welches","über","aus","durch","kann","können","mein","meine","dein","ihre","sehr","mehr","weniger","viel","viele","dass","damit","noch","nur","bereits","sowie","etwa","beim","einem","einen","dieser","dieses","diese","eierkuchen","eierkuchenteig","pfannkuchen","zubereiten","servieren","passt","eignen","geeignet","besonders","gut","thema","themen","grundlegenden","grundlegend","fakten","physikalischen","physikalische","chemischen","chemische","vorgänge","vorgang","relevant","typische","typischen","fehler","messbaren","messbare","faktoren","faktor","wichtig","besonders","varianten","unterschiede","praktischen","praktische","auswirkungen","auswirkung","fertige","fertigen","gericht","küchenregeln","küchenregel","kennen","verbreiteten","verbreitete","missverständnisse","missverständnis","beobachtungen","beobachtung","wissenschaftlich","erklären","erklärbar","gibt","treten","wirkt","wirkung","gelingen","gelingt","machen","mache","funktioniert","funktionieren","bekomme","bekommen","erreichen","sorgen"]);

let index={};
let tokenDocs=new Map();
let docTokenCounts=new Map();
let tokenLexicon=new Set();

function setCollection(newDocs,name){
  docs=newDocs.map((d,i)=>({
    id:d.id||`U${String(i+1).padStart(3,"0")}`,
    title:d.title||`Dokument ${i+1}`,
    category:d.category||"Eigene Kollektion",
    content:String(d.content||"").trim()
  })).filter(d=>d.content);

  byId=Object.fromEntries(docs.map(d=>[d.id,d]));
  rawById=Object.fromEntries(docs.map(d=>[d.id,{...d}]));
  collectionName=name||"Eigene Kollektion";
  buildIndex();
  updateCollectionUI();
}

function updateCollectionUI(){
  const b=document.getElementById("openDocs");
  const t=document.getElementById("docTotal");
  const n=document.getElementById("collectionName");
  const m=document.getElementById("collectionMeta");
  if(b){
    const label=b.querySelector("span:last-child");
    if(label)label.textContent=docs.length+" Dokumente";
    else b.textContent=docs.length+" Dokumente";
  }
  if(t)t.textContent=docs.length+" Dokumente";
  if(n)n.textContent=collectionName;
  if(m)m.textContent=docs.length+" Dokumente";
}

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]||m))}
function tokenize(s){return s.match(/[\p{L}\p{N}]+(?:[-–][\p{L}\p{N}]+)*|[.,!?;:]/gu)||[]}
function norm(t){return t.toLocaleLowerCase("de-DE")}
function resolveLexeme(part){
  if(tokenLexicon.has(part))return part;
  for(const ending of ["n","en","s","es","er"]){
    if(part.endsWith(ending)){
      const base=part.slice(0,-ending.length);
      if(base.length>=3&&tokenLexicon.has(base))return base;
    }
  }
  return null;
}
function compoundParts(token){
  const out=[];
  if(token.length<7)return out;

  for(let i=3;i<=token.length-3;i++){
    const left=resolveLexeme(token.slice(0,i));
    const right=resolveLexeme(token.slice(i));
    if(left&&right){
      out.push(left,right);
      break;
    }
  }

  // Falls nur ein klarer Bestandteil als Präfix/Suffix vorkommt.
  if(!out.length){
    const candidates=[...tokenLexicon]
      .filter(x=>x.length>=4&&x.length<=token.length-3&&(token.startsWith(x)||token.endsWith(x)))
      .sort((a,b)=>b.length-a.length)
      .slice(0,2);
    out.push(...candidates);
  }
  return out;
}
function queryTerms(s){
  const base=tokenize(s).map(norm).filter(t=>t.length>2&&!STOP.has(t)&&!PUNCT.has(t));
  const expanded=[];
  for(const t of base){
    expanded.push(t,...compoundParts(t));
  }
  return [...new Set(expanded)].filter(t=>!STOP.has(t));
}
function sentenceList(text){
  const pieces=String(text).match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[];
  const sentences=[];
  let current='';
  for(let i=0;i<pieces.length;i++){
    current+=pieces[i];
    // Ein Punkt nach einer Ordinalzahl ist mitten im Satz kein Satzende (19. Jahrhundert).
    if(/\b\d+\.$/.test(current.trim())&&/^\s*\p{L}/u.test(pieces[i+1]||''))continue;
    sentences.push(current.trim());current='';
  }
  if(current.trim())sentences.push(current.trim());
  return sentences;
}

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function untokenize(ts){let out="";for(const t of ts){if(PUNCT.has(t))out=out.trimEnd()+t+" ";else out+=t+" ";}return out.trim()}
function wordCount(s){return tokenize(s).filter(t=>!PUNCT.has(t)).length}
function addBoost(obj,ids,value){for(const id of ids)obj[id]=(obj[id]||0)+value}


function buildIndex(){
  index={};
  tokenDocs=new Map();
  docTokenCounts=new Map();
  tokenLexicon=new Set();
  for(let n=1;n<=5;n++)index[n]=new Map();

  for(const d of docs){
    const ts=tokenize(d.content);
    const counts=new Map();

    for(const t of ts){
      if(PUNCT.has(t))continue;
      const k=norm(t);
      tokenLexicon.add(k);
      counts.set(k,(counts.get(k)||0)+1);
      if(!tokenDocs.has(k))tokenDocs.set(k,new Set());
      tokenDocs.get(k).add(d.id);
    }
    docTokenCounts.set(d.id,counts);

    for(let n=1;n<=5;n++){
      const contextLen=n-1;
      for(let i=contextLen;i<ts.length;i++){
        const key=contextLen?ts.slice(i-contextLen,i).map(norm).join("¦"):"";
        const next=ts[i],nk=norm(next);
        if(!index[n].has(key))index[n].set(key,new Map());
        const bucket=index[n].get(key);
        if(!bucket.has(nk))bucket.set(nk,{forms:new Map(),docs:new Map(),count:0});
        const rec=bucket.get(nk);
        rec.count++;
        rec.forms.set(next,(rec.forms.get(next)||0)+1);
        rec.docs.set(d.id,(rec.docs.get(d.id)||0)+1);
      }
    }
  }
}

function morphStem(word){
  let w=norm(word);
  if(w.length<=4)return w;
  const endings=["ern","em","en","er","es","e","n","s"];
  for(const ending of endings){
    if(w.endsWith(ending) && w.length-ending.length>=5){
      return w.slice(0,-ending.length);
    }
  }
  return w;
}
function termHits(counts,t){
  let hits=counts.get(t)||0;
  if(hits)return hits;

  const target=morphStem(t);
  for(const [k,c] of counts){
    if(morphStem(k)===target)hits+=c*.55;
  }

  // kurze Adjektive wie "zäh" -> "zäher/zähe", aber keine allgemeinen Präfixe
  if(!hits && t.length>=3 && t.length<=4){
    const allowed=new Set(["e","er","es","en","em"]);
    for(const [k,c] of counts){
      if(k.startsWith(t) && allowed.has(k.slice(t.length)))hits+=c*.5;
    }
  }
  return hits;
}

function documentScore(q,d){
  const terms=queryTerms(q);
  if(!terms.length)return 1;
  const counts=docTokenCounts.get(d.id)||new Map();
  const title=new Set(queryTerms(d.title+" "+d.category));
  let score=0;

  for(const t of terms){
    const hits=termHits(counts,t);
    const df=(tokenDocs.get(t)||new Set()).size;
    const idf=Math.log((docs.length+1)/(df+1))+1;
    if(title.has(t))score+=4.5*idf;
    if(hits)score+=(1+Math.log(1+hits))*idf;
  }
  return score;
}

function retrieve(q){
  let ranked=docs.map(d=>({doc:d,score:documentScore(q,d)}))
    .sort((a,b)=>b.score-a.score||a.doc.id.localeCompare(b.doc.id));

  if(!ranked.length)return [];
  const top=ranked[0].score;
  if(top<=0)return ranked.slice(0,Math.min(10,ranked.length)).map(x=>({...x,score:1}));

  // Für die sichtbare Antwort zählen hauptsächlich starke Treffer.
  // Für die Wortwahrscheinlichkeiten bleiben auch schwächere Dokumente im lokalen Pool.
  return ranked.slice(0,Math.min(10,ranked.length));
}

function contextWeight(id,relevant){
  const row=relevant.find(x=>x.doc.id===id);
  if(!row)return 0;
  const top=relevant[0]?.score||1;
  const rel=Math.max(.08,row.score/top);
  return .35+3.4*Math.pow(rel,1.35);
}

function bestForm(forms){
  return [...forms.entries()].sort((a,b)=>b[1]-a[1])[0]?.[0]||"";
}

function distribution(context,relevant,preferredDoc=null,opts={}){
  const maxN=Math.min(5,opts.maxN??5);
  const minN=Math.max(1,opts.minN??1);
  const temperature=opts.temperature??.82;
  const excludeDoc=opts.excludeDoc||null;
  const allowed=new Set(relevant.map(x=>x.doc.id));

  for(let n=Math.min(maxN,context.length+1);n>=minN;n--){
    const key=n===1?"":context.slice(-(n-1)).map(norm).join("¦");
    const bucket=index[n]?.get(key);
    if(!bucket?.size)continue;

    const rows=[];
    for(const rec of bucket.values()){
      let weightedCount=0,source=null,sourceW=0;
      const contributors=[];

      for(const [id,count] of rec.docs){
        if(!allowed.has(id)||id===excludeDoc)continue;
        let w=count*contextWeight(id,relevant);
        if(id===preferredDoc)w*=1.28;
        weightedCount+=w;
        contributors.push({doc:id,w});
        if(w>sourceW){sourceW=w;source=id}
      }
      if(weightedCount<=0)continue;

      // Soekia-artig: längeres N, Häufigkeit und Dokumentkontext wirken zusammen.
      const nFactor=1+(.34*(n-1));
      const freqFactor=1+Math.log1p(rec.count)*.10;
      const raw=weightedCount*nFactor*freqFactor;

      contributors.sort((a,b)=>b.w-a.w);
      rows.push({
        token:bestForm(rec.forms),
        doc:source,
        n,
        raw,
        contributors:contributors.map(x=>({doc:x.doc,p:x.w/weightedCount}))
      });
    }

    if(rows.length){
      for(const r of rows)r.weight=Math.pow(Math.max(r.raw,.000001),1/temperature);
      const sum=rows.reduce((a,x)=>a+x.weight,0)||1;
      for(const r of rows)r.p=r.weight/sum;
      rows.sort((a,b)=>b.p-a.p);
      return rows;
    }
  }
  return [];
}

function sample(rows,opts={}){
  if(!rows.length)return null;
  const topK=Math.min(opts.topK??10,rows.length);
  const minRank=Math.min(opts.minRank??0,Math.max(0,topK-1));
  let pool=rows.slice(minRank,topK);
  if(!pool.length)pool=rows.slice(0,topK);

  const sum=pool.reduce((a,x)=>a+x.p,0)||1;
  let r=Math.random()*sum;
  for(const x of pool){r-=x.p;if(r<=0)return x}
  return pool[pool.length-1];
}

function sentenceScore(sentence,q){
  const terms=queryTerms(q);
  if(!terms.length)return 0;
  const counts=new Map();
  for(const t of tokenize(sentence).map(norm)){
    if(!PUNCT.has(t))counts.set(t,(counts.get(t)||0)+1);
  }
  return terms.reduce((a,t)=>a+termHits(counts,t),0);
}

function tokenOverlap(a,b){
  if(!b)return 0;
  const A=new Set(queryTerms(a)),B=new Set(queryTerms(b));
  let n=0;for(const t of A)if(B.has(t))n++;
  return n;
}

function seedFromDoc(doc,q,avoid=""){
  const ranked=sentenceList(doc.content)
    .filter(sentence=>!repetitionConflict(sentence,avoid))
    .map(sentence=>({sentence,score:sentenceScore(sentence,q)-maxSimilarityToText(sentence,avoid)}));
  const chosen=weightedCandidate(ranked,'score',5)?.sentence;
  if(!chosen)return null;
  const ts=tokenize(chosen);
  return {doc:doc.id,tokens:ts.slice(0,Math.min(4,ts.length))};
}

const WEAK_WORDS=new Set(["und","oder","aber","mit","von","für","zu","zum","zur","die","der","das","ein","eine","einer","einem","einen","im","in","auf","nur","sowie","weil","dass","wenn","denn","als","bei"]);
const CONNECTORS=new Set(["und","oder","aber","sowie","weil","dass","wenn","denn","während","obwohl"]);
const PREPOSITIONS=new Set(["mit","von","für","zu","zum","zur","im","in","auf","bei","aus","durch","ohne","über","unter"]);

function fluencyPenalty(text){
  const tokens=tokenize(text).map(norm);
  const words=tokens.filter(t=>!PUNCT.has(t));
  let penalty=0;

  if(words.length<6)penalty+=(6-words.length)*.35;
  if(words.length>28)penalty+=(words.length-28)*.16;

  // direkte Wortwiederholungen
  for(let i=1;i<words.length;i++){
    if(words[i]===words[i-1])penalty+=1.6;
  }

  // unnatürliche Folgen von Funktionswörtern
  for(let i=1;i<words.length;i++){
    const a=words[i-1],b=words[i];
    if(CONNECTORS.has(a)&&CONNECTORS.has(b))penalty+=1.15;
    if(PREPOSITIONS.has(a)&&PREPOSITIONS.has(b))penalty+=.9;
    if(["der","die","das","ein","eine","einer","einem","einen"].includes(a) &&
       ["der","die","das","ein","eine","einer","einem","einen"].includes(b))penalty+=1.2;
  }

  // wiederholte Bi-/Trigramme
  for(const n of [2,3]){
    const seen=new Set();
    for(let i=0;i<=words.length-n;i++){
      const key=words.slice(i,i+n).join("¦");
      if(seen.has(key))penalty+=n===3?1.4:.8;
      seen.add(key);
    }
  }

  if(/\b(deshalb|dadurch|daher)\s+(nur|die|der|das|ein|eine)\b/i.test(text))penalty+=.9;
  if(/\b(und|oder|aber|weil|dass|wenn|mit|von|für|zu|im|in|auf)[.!?]$/i.test(text.trim()))penalty+=2;
  if(/[,;:]\s*[.!?]/.test(text))penalty+=.8;

  return penalty;
}

function generationStats(seg){
  const generated=seg.filter(x=>x.p!==1);
  const avgN=generated.length?generated.reduce((a,x)=>a+(x.n||1),0)/generated.length:5;
  const lowOrder=generated.length?generated.filter(x=>(x.n||1)<=2).length/generated.length:0;
  const avgLogP=generated.length?generated.reduce((a,x)=>a+Math.log(Math.max(x.p||.0001,.0001)),0)/generated.length:0;
  return {avgN,lowOrder,avgLogP};
}

function sentenceCandidateScore(seg,q,relevant,avoid=""){
  const text=untokenize(seg.map(x=>x.t));
  const stats=generationStats(seg);
  const topic=topicRelevance(text,q);
  const support=supportScore(text,relevant);
  const repetition=maxSimilarityToText(text,avoid);
  const fluency=fluencyPenalty(text);
  const sourceSim=sourceSentenceSimilarity(text,relevant);

  return {
    text,
    score:
      topic*2.35 + support*1.2 + sourceSim*1.45 + stats.avgN*.34 + stats.avgLogP*.05 -
      stats.lowOrder*1.35 - repetition*1.05 - fluency*1.35,
    ...stats,topic,support,repetition,fluency,sourceSim
  };
}

function generateSentenceOnce(q,relevant,preferredDoc,avoid="",opts={}){
  const doc=byId[preferredDoc]||relevant[0]?.doc;
  if(!doc)return [];
  const localRow=relevant.find(x=>x.doc.id===doc.id)||{doc,score:relevant[0]?.score||1};
  const seed=seedFromDoc(doc,q,avoid);
  if(!seed)return [];
  let context=seed.tokens.slice();
  const out=seed.tokens.map(t=>({t,doc:seed.doc,kind:"source",n:5,p:1}));
  for(let i=0;i<32;i++){
    const rows=distribution(context,[localRow],doc.id,{
      maxN:5,minN:3,temperature:opts.temperature??.70
    });
    const choice=sample(rows,{topK:opts.topK??3});
    if(!choice)break;
    out.push({t:choice.token,doc:choice.doc||doc.id,kind:"source",n:choice.n,p:choice.p});
    context.push(choice.token);if(context.length>4)context.shift();
    // Ein Kandidat enthält immer genau einen Satz, auch wenn dieser kurz ist.
    if(/[.!?]/.test(choice.token))break;
  }
  return out;
}

function generateSentence(q,relevant,preferredDoc,avoid="",opts={}){
  const candidates=[];
  for(let i=0;i<(opts.tries??8);i++){
    const seg=generateSentenceOnce(q,relevant,preferredDoc,avoid,{
      ...opts,temperature:(opts.temperature??.64)+Math.random()*.05
    });
    if(!seg.length)continue;
    const text=untokenize(seg.map(x=>x.t));
    if(wordCount(text)>(opts.maxWords??32)||!usableSentence(text)||repetitionConflict(text,avoid))continue;
    const scored=sentenceCandidateScore(seg,q,relevant,avoid);
    if(scored.lowOrder<.26&&scored.support>=.88&&scored.sourceSim>=.88){
      candidates.push({seg,...scored});
    }
  }
  if(candidates.length)return weightedCandidate(candidates,'score',4).seg;
  const doc=byId[preferredDoc]||relevant[0]?.doc;
  if(!doc)return [];
  const rows=sentenceList(doc.content)
    .filter(sentence=>wordCount(sentence)<=(opts.maxWords??32)&&usableSentence(sentence)&&!repetitionConflict(sentence,avoid))
    .map(sentence=>({sentence,score:sentenceScore(sentence,q)-maxSimilarityToText(sentence,avoid)}));
  const chosen=weightedCandidate(rows,'score',5);
  return chosen?tokenize(chosen.sentence).map(t=>({t,doc:doc.id,kind:"source",n:5,p:1})):[];
}

function sentenceSimilarity(a,b){
  const aw=wordsOf(a),bw=wordsOf(b),A=new Set(aw),B=new Set(bw);
  let shared=0;for(const word of A)if(B.has(word))shared++;
  let prefix=0;while(prefix<Math.min(aw.length,bw.length)&&aw[prefix]===bw[prefix])prefix++;
  const content=words=>new Set(words.filter(w=>w.length>2&&!STOP.has(w)));
  const ac=content(aw),bc=content(bw);
  let contentShared=0;for(const word of ac)if(bc.has(word))contentShared++;
  const prefixWords=Math.min(5,aw.length,bw.length);
  const ap=new Set(aw.slice(0,prefixWords)),bp=new Set(bw.slice(0,prefixWords));
  let prefixShared=0;for(const word of ap)if(bp.has(word))prefixShared++;
  let longestRun=0;
  for(let i=0;i<aw.length;i++)for(let j=0;j<bw.length;j++){
    let run=0;while(i+run<aw.length&&j+run<bw.length&&aw[i+run]===bw[j+run])run++;
    longestRun=Math.max(longestRun,run);
  }
  return {
    prefix,
    longestRun,
    prefixOverlap:prefixWords>=3?prefixShared/prefixWords:0,
    jaccard:shared/Math.max(1,A.size+B.size-shared),
    overlap:shared/Math.max(1,Math.min(A.size,B.size)),
    contentOverlap:contentShared/Math.max(1,Math.min(ac.size,bc.size)),
    contentShared
  };
}

function repetitionConflict(text,previous,strict=false){
  const sentences=Array.isArray(previous)?previous:previous?sentenceList(previous):[];
  return sentences.some(sentence=>{
    const s=sentenceSimilarity(text,sentence);
    // Drei gleiche Anfangswörter schließen damit auch gleiche 4er-/5er-Präfixe aus.
    return s.prefix>=3||s.longestRun>=6||s.jaccard>=(strict?.50:.62)||s.overlap>=(strict?.72:.82)||
      (s.prefix>=2&&s.prefixOverlap>=(strict?.60:.80))||
      (s.contentShared>=3&&s.contentOverlap>=(strict?.72:.85));
  });
}

function usableSentence(text){
  return completeSentence(text)&&sentenceList(text).length===1&&
    tokenize(text).filter(t=>/[.!?]/.test(t)).length===1&&
    fluencyPenalty(text)<.8&&!/(?:[,;:]\s*|\b\d+\.)[.!?]?$/.test(text);
}

function weightedCandidate(rows,key='score',topK=6){
  if(!rows.length)return null;
  const pool=rows.slice().sort((a,b)=>b[key]-a[key]).slice(0,topK);
  const best=pool[0][key];
  const weights=pool.map(row=>Math.exp(Math.max(-6,row[key]-best)));
  let r=Math.random()*weights.reduce((sum,w)=>sum+w,0);
  for(let i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
  return pool[pool.length-1];
}

function hallucinationPool(q,relevant){
  const contrasts=[],generic=[],seen=new Set();
  for(let risk=0;risk<3;risk++){
    for(const point of contrastPairCandidates(q,relevant,risk)){
      if(seen.has(point.text))continue;seen.add(point.text);
      contrasts.push(point);
    }
    for(const point of genericBranchPoints(q,relevant,risk)){
      const key=[point.sourceDoc,point.targetDoc,point.prefix.join(' '),point.token].join('|');
      if(seen.has(key))continue;seen.add(key);generic.push(point);
    }
  }
  return {contrasts,generic};
}

function generationContext(q,relevant){
  const lead=relevant[0],top=lead.score||1;
  let pool=relevant.filter(row=>row.score>0&&row.score>=top*.28).slice(0,6);
  if(pool.length<2)pool=relevant.slice(0,Math.min(4,relevant.length));
  // Bei sehr schmalen Treffern neue N-Gramm-Pfade in verwandten Dokumenten suchen.
  // Auswahl bleibt korpusbasiert: Titel und Kategorie des stärksten Treffers liefern den Kontext.
  const contextual=docs.filter(doc=>doc.category===lead.doc.category)
    .map(doc=>({doc,score:Math.max(documentScore(q,doc),
      Math.min(top*.60,documentScore(q+' '+lead.doc.title+' '+lead.doc.category,doc)*.45))}))
    .sort((a,b)=>b.score-a.score);
  const ids=new Set(pool.map(row=>row.doc.id));
  for(const row of contextual){
    if(pool.length>=8)break;
    if(!ids.has(row.doc.id)){pool.push(row);ids.add(row.doc.id)}
  }
  return pool.sort((a,b)=>b.score-a.score);
}

function wordsOf(text){
  return tokenize(text).map(norm).filter(t=>!PUNCT.has(t));
}
function jaccardText(a,b){
  const A=new Set(wordsOf(a)),B=new Set(wordsOf(b));
  if(!A.size||!B.size)return 0;
  let i=0;for(const x of A)if(B.has(x))i++;
  return i/(A.size+B.size-i);
}
function maxSimilarityToText(text,all){
  if(!all)return 0;
  return Math.max(0,...sentenceList(all).map(s=>jaccardText(text,s)));
}
function exactInAnyDocument(text,relevant){
  const target=norm(text).replace(/\s+/g," ").trim();
  return relevant.some(r=>norm(r.doc.content).replace(/\s+/g," ").includes(target));
}
function ngramSet(text,n){
  const w=wordsOf(text),set=new Set();
  for(let i=0;i<=w.length-n;i++)set.add(w.slice(i,i+n).join("¦"));
  return set;
}
function supportScore(text,relevant){
  const w=wordsOf(text);
  if(w.length<4)return 1;
  const tri=[],four=[];
  for(let i=0;i<=w.length-3;i++)tri.push(w.slice(i,i+3).join("¦"));
  for(let i=0;i<=w.length-4;i++)four.push(w.slice(i,i+4).join("¦"));

  let best=0;
  for(const row of relevant){
    const d3=ngramSet(row.doc.content,3),d4=ngramSet(row.doc.content,4);
    const dwords=new Set(wordsOf(row.doc.content));
    const th=tri.length?tri.filter(x=>d3.has(x)).length/tri.length:0;
    const fh=four.length?four.filter(x=>d4.has(x)).length/four.length:th;
    const wh=w.filter(x=>dwords.has(x)).length/w.length;
    best=Math.max(best,fh*.55+th*.30+wh*.15);
  }
  return best;
}
function topicRelevance(text,q){
  const terms=queryTerms(q);
  if(!terms.length)return .2;
  const textTerms=new Set(queryTerms(text));
  let hit=0;
  for(const t of terms){
    if(textTerms.has(t)){hit++;continue}
    const counts=new Map([...textTerms].map(x=>[x,1]));
    if(termHits(counts,t)>0)hit++;
  }
  return hit/terms.length;
}
function sourceSentenceSimilarity(text,relevant){
  let best=0;
  for(const row of relevant){
    for(const sentence of sentenceList(row.doc.content)){
      best=Math.max(best,jaccardText(text,sentence));
    }
  }
  return best;
}
function completeSentence(text){
  return /[.!?]$/.test(text.trim())&&!/\b(und|oder|aber|mit|von|für|zu|zum|zur|im|in|auf|weil|dass|wenn)[.!?]$/i.test(text.trim());
}

const CONTRAST_GROUPS=[
  ["dicker","dünner"],["zäher","zarter"],["vegan","tierisch"],["glutenhaltig","glutenfrei"],["schneller","langsamer"],["kompakter","lockerer"],["erhöhen","verringern"],["erleichtern","erschweren"],["verbessern","verschlechtern"],
  ["verlängern","verkürzen"],["beschleunigen","verlangsamen"],["verstärken","verringern"],["flüssigeren","dickeren"],["größere","kleinere"],
  ["salziger","süßer"],["stärker","weniger"],["zäher","weniger"],["geeignet","ungeeignet"],
  ["proteingehalt","ballaststoffgehalt"],["fettgehalt","kohlenhydratgehalt"]
];
function hasNegation(text){return /\b(nicht|kein|keine|keinen|keinem|keiner|nie|ohne)\b/i.test(text)}
function contrastBetween(a,b){
  const A=new Set(wordsOf(a)),B=new Set(wordsOf(b));
  let score=0;
  if(hasNegation(a)!==hasNegation(b))score+=1;
  for(const group of CONTRAST_GROUPS){
    const ga=group.some(x=>A.has(x)),gb=group.some(x=>B.has(x));
    if(ga&&gb){
      const va=group.find(x=>A.has(x)),vb=group.find(x=>B.has(x));
      if(va&&vb&&va!==vb)score+=.9;
    }
  }
  return score;
}
function sharedBranch(aTokens,bTokens,minCtx,maxCtx){
  const branches=[];
  for(let i=minCtx;i<aTokens.length-1;i++){
    if(PUNCT.has(aTokens[i]))continue;
    for(let j=minCtx;j<bTokens.length-1;j++){
      if(PUNCT.has(bTokens[j]))continue;
      if(norm(aTokens[i])===norm(bTokens[j]))continue;
      for(let ctx=maxCtx;ctx>=minCtx;ctx--){
        if(i<ctx||j<ctx)continue;
        if(Math.abs(i-j)>3)continue;
        const aPrev=aTokens[i-1],bPrev=bTokens[j-1];
        if(PUNCT.has(aPrev)||PUNCT.has(bPrev))continue;
        let same=true;
        for(let k=1;k<=ctx;k++){

    const target=68+Math.floor(Math.random()*15);
    for(let i=0;i<12&&normalWords()+hallu.words<target;i++){

    answerEl.innerHTML=guessableAnswer(res.tokens,selectedGuess,false);
  });

  revealButton.addEventListener("click",()=>{
    const opening=!turn.classList.contains("revealed");
    const on=turn.classList.toggle("revealed");
    revealButton.textContent=on?"Auflösung ausblenden":"Auflösung anzeigen";

    if(opening){
      guessLocked=true;
      const correct=selectedGuess!==null && Boolean(chunks[selectedGuess]?.isHallu);

      answerEl.innerHTML=revealedAnswer(res.tokens,selectedGuess);

      guessResult.className="guess-result "+(selectedGuess===null?"neutral":correct?"correct":"wrong");
      if(selectedGuess===null){
        guessResultIcon.textContent="!";
        guessResultText.textContent="Keine Vermutung abgegeben. Die tatsächliche Halluzination ist jetzt rot markiert.";
      }else if(correct){
        guessResultIcon.textContent="✓";
        guessResultText.textContent="Treffer! Du hast den Halluzinationssatz richtig erkannt.";
        if(!celebrated){
          playSuccess(turn);
          celebrated=true;
        }
      }else{
        guessResultIcon.textContent="↗";
        guessResultText.textContent="Deine Vermutung war nicht richtig. Deine Auswahl bleibt orange markiert; rot siehst du die tatsächliche Halluzination.";
      }

      const ids=[...new Set(res.tokens.map(x=>x.doc).filter(Boolean))];
      turn.querySelector(".sources").innerHTML=ids.map(id=>{
        const d=byId[id],sn=bestSnippet(res.tokens,id);
        return `<div class="source-card" style="${cardStyle(id)}"><button data-doc="${id}" style="color:${docPalette(id).text}">${id} · ${esc(d.title)}</button><div class="meta">${esc(d.category)} · ${wordCount(d.content)} Wörter</div><div>${highlight(d.content,sn,id)}</div></div>`;
      }).join("");
    }else{
      answerEl.innerHTML=guessableAnswer(res.tokens,selectedGuess,true);
    }
  });
  turn.addEventListener("click",e=>{
    const b=e.target.closest("[data-doc]");
    if(b) openDoc(b.dataset.doc);
  });
}

async function submit(){
  if(generating)return;
  const p=document.getElementById("prompt"),q=p.value.trim();
  if(!q)return;
  generating=true;
  document.getElementById("send").disabled=true;
  p.value="";p.style.height="42px";
  try{await addTurn(q)}finally{generating=false;document.getElementById("send").disabled=false;p.focus()}
}
const prompt=document.getElementById("prompt");
prompt.addEventListener("input",()=>{
  prompt.style.height="42px";
  prompt.style.height=Math.min(prompt.scrollHeight,130)+"px";
});
prompt.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submit()}
});
document.getElementById("send").addEventListener("click",submit);
document.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>{prompt.value=b.dataset.q;submit()}));

const drawer=document.getElementById("drawer"),backdrop=document.getElementById("backdrop"),docList=document.getElementById("docList"),docView=document.getElementById("docView"),docSearch=document.getElementById("docSearch");

const collectionFiles=document.getElementById("collectionFiles");
const collectionMessage=document.getElementById("collectionMessage");

function normalizeImportedDoc(item,i){
  if(typeof item==="string")return {title:`Dokument ${i+1}`,category:"Eigene Kollektion",content:item};
  if(!item||typeof item!=="object")return null;
  const content=item.content??item.text??item.body??"";
  if(!String(content).trim())return null;
  return {
    title:item.title??item.name??`Dokument ${i+1}`,
    category:item.category??"Eigene Kollektion",
    content:String(content)
  };
}

function splitTextFile(text,baseName){
  const cleaned=String(text||"").trim();
  if(!cleaned)return [];
  const parts=cleaned.split(/\n\s*\n+/).map(x=>x.trim()).filter(x=>wordCount(x)>=25);
  if(parts.length>=2){
    return parts.map((content,i)=>({title:`${baseName} · ${i+1}`,category:"Eigene Kollektion",content}));
  }
  return [{title:baseName,category:"Eigene Kollektion",content:cleaned}];
}

async function readCollectionFiles(files){
  const imported=[];
  for(const file of files){
    const text=await file.text();
    if(file.name.toLowerCase().endsWith(".json")){
      let data;
      try{data=JSON.parse(text)}catch{throw new Error(`"${file.name}" ist keine gültige JSON-Datei.`)}
      const list=Array.isArray(data)?data:Array.isArray(data.documents)?data.documents:[];
      for(const item of list){
        const d=normalizeImportedDoc(item,imported.length);
        if(d)imported.push(d);
      }
    }else{
      const base=file.name.replace(/\.[^.]+$/,"");
      imported.push(...splitTextFile(text,base));
    }
  }
  return imported;
}

function activateImportedCollection(imported,name){
  const clean=imported.filter(d=>wordCount(d.content)>=12);
  if(clean.length<2)throw new Error("Die Kollektion braucht mindestens zwei Dokumente oder zwei längere Textabschnitte.");
  const mapped=clean.map((d,i)=>({
    id:`U${String(i+1).padStart(3,"0")}`,
    title:d.title,
    category:d.category,
    content:d.content
  }));
  setCollection(mapped,name||"Eigene Kollektion");
  document.getElementById("chat").innerHTML="";
  renderDocs();
}

document.getElementById("importCollection").addEventListener("click",()=>collectionFiles.click());

function safeFileName(name){
  return String(name||"Kollektion")
    .trim()
    .replace(/[\\/:*?"<>|]+/g,"-")
    .replace(/\s+/g,"_")
    .slice(0,80)||"Kollektion";
}

document.getElementById("downloadCollection").addEventListener("click",()=>{
  const payload={
    name:collectionName,
    documents:docs.map(d=>({
      id:d.id,
      title:d.title,
      category:d.category,
      content:d.content
    }))
  };

  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=safeFileName(collectionName)+".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);

  collectionMessage.className="collection-message";
  collectionMessage.textContent="Kollektion wurde als JSON heruntergeladen.";
});

collectionFiles.addEventListener("change",async()=>{
  const files=[...collectionFiles.files];
  if(!files.length)return;
  collectionMessage.className="collection-message";
  collectionMessage.textContent="Kollektion wird geladen …";
  try{
    const imported=await readCollectionFiles(files);
    const name=files.length===1?files[0].name.replace(/\.[^.]+$/,""):"Eigene Kollektion";
    activateImportedCollection(imported,name);
    collectionMessage.textContent=`${docs.length} Dokumente geladen.`;
  }catch(err){
    collectionMessage.className="collection-message error";
    collectionMessage.textContent=err.message||"Kollektion konnte nicht geladen werden.";
  }finally{
    collectionFiles.value="";
  }
});

document.getElementById("resetCollection").addEventListener("click",()=>{
  setCollection(DEFAULT_COLLECTION,"Eierkuchen");
  document.getElementById("chat").innerHTML="";
  renderDocs();
  collectionMessage.className="collection-message";
  collectionMessage.textContent="Standardkollektion geladen.";
});


function showDrawer(){drawer.classList.add("open");backdrop.classList.add("open");drawer.setAttribute("aria-hidden","false")}
function hideDrawer(){drawer.classList.remove("open");backdrop.classList.remove("open");drawer.setAttribute("aria-hidden","true")}
document.getElementById("openDocs").addEventListener("click",showDrawer);
document.getElementById("closeDocs").addEventListener("click",hideDrawer);
backdrop.addEventListener("click",hideDrawer);

function renderDocs(filter=""){
  const f=norm(filter);
  const shown=docs.filter(d=>norm(d.id+" "+d.title+" "+d.category+" "+d.content).includes(f));
  docList.style.display="block";docSearch.style.display="block";docView.classList.remove("open");
  docList.innerHTML=shown.map(d=>`<div class="doc-item"><button data-open="${d.id}"><b>${d.id} · ${esc(d.title)}</b><span>${esc(d.category)}</span></button></div>`).join("");
}
function openDoc(id){
  const d=byId[id];if(!d)return;
  showDrawer();
  docList.style.display="none";docSearch.style.display="none";docView.classList.add("open");
  docView.innerHTML=`<button class="doc-back">← Alle Dokumente</button><h3>${d.id} · ${esc(d.title)}</h3><div class="meta">${esc(d.category)} · ${wordCount(d.content)} Wörter</div><p>${esc(d.content)}</p>`;
  docView.querySelector(".doc-back").addEventListener("click",()=>renderDocs(docSearch.value));
}
docSearch.addEventListener("input",e=>renderDocs(e.target.value));
docList.addEventListener("click",e=>{const b=e.target.closest("[data-open]");if(b)openDoc(b.dataset.open)});

setCollection(DEFAULT_COLLECTION,"Eierkuchen");
renderDocs();
</script>
</body>
</html>
