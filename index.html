<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HalluBot</title>
<style>
:root{
  --bg:#ffffff;--ink:#202124;--muted:#70757a;--line:#e5e7eb;--soft:#f7f7f8;
  --accent:#111827;--source:#fff0a8;--source-line:#d7a600;
  --hallu:#ffdcdc;--hallu-ink:#8a1f1f;--hallu-line:#e25c5c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.topbar{
  height:58px;display:flex;align-items:center;justify-content:flex-end;
  padding:0 22px;border-bottom:1px solid rgba(229,231,235,.75);background:rgba(255,255,255,.93);
  backdrop-filter:blur(10px);position:sticky;top:0;z-index:20
}
.docs-button{border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:9px;font-size:13px}
.docs-button:hover{background:var(--soft);color:var(--ink)}
.app{width:min(820px,calc(100% - 32px));margin:0 auto;padding-bottom:36px}
.hero{padding:72px 0 22px;text-align:center}
.hero h1{font-size:56px;line-height:1;margin:0;letter-spacing:-.055em;font-weight:720}
.composer-zone{position:sticky;bottom:0;z-index:12;padding:18px 0 18px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 28%,#fff)}
.prompt-shell{
  display:flex;align-items:flex-end;gap:8px;width:min(700px,100%);margin:0 auto;
  border:1px solid #dadce0;border-radius:26px;padding:9px 10px 9px 18px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);background:#fff
}
.prompt-shell:focus-within{border-color:#c4c7c5;box-shadow:0 4px 18px rgba(0,0,0,.08)}
textarea{
  min-height:42px;max-height:130px;resize:none;flex:1;border:0;outline:0;
  padding:10px 2px 6px;background:transparent;line-height:1.4;font-size:16px
}
.send{
  width:42px;height:42px;border:0;border-radius:50%;background:var(--accent);color:white;
  display:grid;place-items:center;font-size:20px;flex:0 0 auto
}
.send:disabled{opacity:.35;cursor:default}
.suggestions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:24px}
.suggestions button{
  border:1px solid var(--line);background:white;color:#565b63;padding:7px 11px;
  border-radius:999px;font-size:12px
}
.suggestions button:hover{background:var(--soft)}
.chat{padding:4px 0 8px;min-height:18px}
.turn{padding:24px 0;border-top:1px solid #f0f1f2}
.user-row{display:flex;justify-content:flex-end;margin-bottom:20px}
.user-bubble{max-width:74%;background:#f3f4f6;border-radius:20px 20px 5px 20px;padding:11px 15px;line-height:1.45;font-size:14px}
.bot-row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px}
.avatar{
  width:32px;height:32px;border-radius:50%;background:#111827;color:white;display:grid;place-items:center;
  font-size:14px;font-weight:800
}
.bot-name{font-size:13px;font-weight:700;margin:1px 0 7px}
.answer{font-size:15.5px;line-height:1.68}
.answer p{margin:0}.answer-text.generating::after{content:"";display:inline-block;width:7px;height:1.08em;margin-left:3px;vertical-align:-2px;background:#333;animation:blink .8s steps(1) infinite}.thinking{display:inline-flex;gap:4px;align-items:center;height:24px}.thinking i{width:6px;height:6px;border-radius:50%;background:#8b9097;animation:pulse 1.05s infinite ease-in-out}.thinking i:nth-child(2){animation-delay:.13s}.thinking i:nth-child(3){animation-delay:.26s}@keyframes pulse{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
.actions{display:flex;gap:6px;margin-top:10px}
.action{
  border:0;background:transparent;color:#777d86;border-radius:8px;padding:6px 8px;font-size:12px
}
.action:hover{background:var(--soft);color:#333}
.reveal-panel{display:none;margin-top:13px;border:1px solid #f0c2c2;background:#fff8f8;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.5;color:#711d1d}
.turn.revealed .reveal-panel{display:block}
.sources{display:none;margin-top:10px}
.turn.revealed .sources{display:block}
.source-card{border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:11px 12px;margin-top:8px;background:#fff;font-size:12px;line-height:1.5}
.source-card button{all:unset;cursor:pointer;font-weight:750}
.source-card button:hover{text-decoration:underline}
.source-card .meta{font-size:11px;color:var(--muted);margin:2px 0 5px}
.source-run{border-radius:3px;padding:1px 2px}
.hallu-run{background:transparent;color:inherit;box-shadow:inset 0 -3px 0 var(--hallu-line);border-radius:3px;padding:1px 2px}
.cite{
  display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
  height:21px;min-width:28px;padding:0 6px;margin:0 2px;border-radius:999px;
  border:1px solid #c7b264;background:#fff8d6;color:#665214;font-size:10px;font-weight:800
}
.cite.h{border-color:#e5a1a1;background:#fff1f1;color:#8a1f1f}
.drawer-backdrop{
  position:fixed;inset:0;background:rgba(17,24,39,.18);z-index:39;opacity:0;pointer-events:none;transition:.18s
}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;right:0;top:0;height:100vh;width:min(520px,92vw);z-index:40;background:white;
  border-left:1px solid var(--line);box-shadow:-18px 0 40px rgba(0,0,0,.10);
  transform:translateX(102%);transition:.22s ease;display:flex;flex-direction:column
}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer-head h2{font-size:18px;margin:0;flex:1}
.close{border:0;background:transparent;font-size:24px;color:var(--muted);border-radius:8px;width:36px;height:36px}
.close:hover{background:var(--soft)}
.doc-search{margin:14px 18px 8px;width:calc(100% - 36px);height:40px;border:1px solid var(--line);border-radius:10px;padding:0 11px;outline:0}
.doc-list{overflow:auto;padding:4px 12px 18px}
.doc-item{border-bottom:1px solid #f0f1f2;padding:12px 8px}
.doc-item button{all:unset;cursor:pointer;display:block;width:100%}
.doc-item b{font-size:13px}.doc-item span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.doc-view{display:none;overflow:auto;padding:18px 20px}
.doc-view.open{display:block}
.doc-view h3{font-size:18px;margin:0 0 3px}
.doc-view .meta{font-size:11px;color:var(--muted);margin-bottom:14px}
.doc-view p{font-size:14px;line-height:1.65;margin:0}
.doc-back{border:0;background:var(--soft);border-radius:8px;padding:7px 9px;margin-bottom:15px;color:#4b5563;font-size:12px}
mark{background:#ffef9f;padding:1px 2px;border-radius:2px}
.footer{display:none}
@media(max-width:640px){
  .topbar{height:52px;padding:0 12px}.app{width:min(100% - 22px,820px)}
  .hero{padding:48px 0 20px}.hero h1{font-size:44px}.prompt-shell{border-radius:22px}.composer-zone{padding-bottom:10px}
  .user-bubble{max-width:88%}.bot-row{grid-template-columns:30px minmax(0,1fr)}.avatar{width:29px;height:29px}
}

/* =========================================================
   HALLUBOT // Halluzinations-Theme
   rein visuell – die Generierungslogik bleibt unverändert
   ========================================================= */
:root{
  --bg:#fffafb;
  --ink:#221c24;
  --muted:#776d79;
  --line:#eadfe5;
  --soft:#f9f3f6;
  --accent:#c4143c;
  --accent-2:#7513b8;
  --accent-3:#ff375f;
  --danger:#d4113f;
  --danger-dark:#790523;
  --danger-soft:#fff0f4;
  --violet-soft:#f7efff;
  --hallu:#ffe4eb;
  --hallu-ink:#8b0a2d;
  --hallu-line:#e5144f;
}
html{background:#fffafb}
body{
  background:
    radial-gradient(circle at 8% -5%,rgba(226,20,79,.12),transparent 27rem),
    radial-gradient(circle at 92% 8%,rgba(117,19,184,.09),transparent 24rem),
    linear-gradient(180deg,#fffafb 0,#fff 38%,#fff 100%);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.22;
  background-image:
    linear-gradient(rgba(117,19,184,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(212,17,63,.045) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,#000,transparent 62%);
}
.topbar{
  height:64px;justify-content:space-between;padding:0 22px;
  border-bottom:1px solid rgba(196,20,60,.12);
  background:rgba(255,250,251,.9);
  box-shadow:0 1px 0 rgba(117,19,184,.04);
}
.topbar-brand{
  display:flex;align-items:center;gap:9px;font-size:12px;font-weight:850;
  letter-spacing:.055em;text-transform:uppercase;color:#5a1830;
}
.brand-icon,.hero-icon,.avatar-icon,.mini-icon,.button-icon,.drawer-icon{
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto
}
.brand-icon{
  width:28px;height:28px;border-radius:9px;
  background:linear-gradient(135deg,#d4113f,#7d16b1);color:#fff;
  box-shadow:0 7px 18px rgba(196,20,60,.2);
}
.brand-icon svg,.mini-icon svg,.button-icon svg,.drawer-icon svg{width:16px;height:16px}
.docs-button{
  display:flex;align-items:center;gap:7px;
  border:1px solid rgba(196,20,60,.16);background:#fff;color:#6b2137;
  padding:8px 11px;border-radius:999px;font-size:12px;font-weight:720;
  box-shadow:0 3px 10px rgba(83,10,41,.045)
}
.docs-button:hover{
  background:var(--danger-soft);border-color:rgba(196,20,60,.28);color:var(--danger-dark)
}
.app{width:min(860px,calc(100% - 32px))}
.hero{padding:62px 0 28px;text-align:center}
.hero-symbol{
  width:74px;height:74px;margin:0 auto 16px;position:relative;
  display:grid;place-items:center;border-radius:24px;
  background:linear-gradient(145deg,#d30e3e 0%,#ab164f 48%,#7413b8 100%);
  box-shadow:
    0 18px 44px rgba(158,14,63,.22),
    -7px 0 0 rgba(255,42,87,.08),
    7px 0 0 rgba(117,19,184,.08);
}
.hero-symbol::before,.hero-symbol::after{
  content:"";position:absolute;inset:9px;border:1px solid rgba(255,255,255,.24);
  border-radius:18px;transform:rotate(3deg)
}
.hero-symbol::after{transform:rotate(-4deg);inset:14px;border-color:rgba(255,255,255,.16)}
.hero-icon{color:white;position:relative;z-index:2}
.hero-icon svg{width:40px;height:40px}
.hero h1{
  position:relative;display:inline-block;
  font-size:64px;font-weight:900;letter-spacing:-.065em;color:#24131d;
  text-shadow:2px 0 rgba(232,20,75,.13),-2px 0 rgba(117,19,184,.12)
}
.hero h1::after{
  content:"";position:absolute;left:10%;right:5%;bottom:-9px;height:5px;border-radius:999px;
  background:linear-gradient(90deg,#d4113f 0 48%,transparent 48% 53%,#7b16b2 53%);
  transform:skewX(-20deg);
}
.hero-kicker{
  margin:22px auto 0;display:flex;align-items:center;justify-content:center;gap:7px;
  color:#a20f37;font-size:11px;font-weight:850;letter-spacing:.11em;text-transform:uppercase
}
.hero-sub{
  margin:8px auto 0;max-width:600px;color:#5f5661;font-size:15px;line-height:1.55
}
.hero-sub strong{color:#261921}
.hero-badges{
  display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:17px
}
.hero-badge{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;
  font-size:11px;font-weight:760;border:1px solid rgba(117,19,184,.13);
  color:#603079;background:rgba(255,255,255,.8)
}
.hero-badge.alert{
  border-color:rgba(212,17,63,.16);color:#8d0c30;background:#fff5f7
}
.composer-zone{
  background:linear-gradient(to bottom,rgba(255,250,251,0),rgba(255,250,251,.96) 28%,#fffafb 62%)
}
.prompt-shell{
  position:relative;border:1px solid rgba(196,20,60,.18);background:rgba(255,255,255,.96);
  box-shadow:0 12px 36px rgba(111,12,51,.09),0 0 0 4px rgba(212,17,63,.025)
}
.prompt-shell::before{
  content:"";position:absolute;left:19px;right:70px;top:-1px;height:2px;
  background:linear-gradient(90deg,#e31b4c,rgba(117,19,184,.15),transparent);
  border-radius:999px
}
.prompt-shell:focus-within{
  border-color:rgba(212,17,63,.45);
  box-shadow:0 14px 38px rgba(111,12,51,.11),0 0 0 4px rgba(212,17,63,.055)
}
textarea{color:#281d24}
textarea::placeholder{color:#a4959d}
.send{
  background:linear-gradient(145deg,#db123f,#9f134e 62%,#7314ae);
  box-shadow:0 6px 16px rgba(196,20,60,.25);transition:.16s transform,.16s box-shadow
}
.send:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 9px 20px rgba(196,20,60,.31)}
.suggestions button{
  border:1px solid rgba(117,19,184,.12);background:rgba(255,255,255,.86);
  color:#6a5965;box-shadow:0 3px 12px rgba(90,23,57,.035)
}
.suggestions button:hover{background:#fff3f6;border-color:rgba(212,17,63,.2);color:#851333}
.turn{padding:27px 0;border-top:1px solid rgba(196,20,60,.075)}
.user-bubble{
  background:#f7eff3;color:#3c2d36;border:1px solid #efe1e8;
  box-shadow:0 4px 12px rgba(64,20,42,.035)
}
.bot-row{grid-template-columns:42px minmax(0,1fr);gap:13px}
.avatar{
  width:38px;height:38px;border-radius:13px;
  background:linear-gradient(145deg,#d4113f,#8115a8);color:white;
  box-shadow:0 8px 18px rgba(160,15,61,.17);
  font-size:0;font-weight:800;position:relative;overflow:hidden
}
.avatar::after{
  content:"";position:absolute;width:22px;height:5px;background:rgba(255,255,255,.18);
  transform:rotate(-22deg);right:-4px;top:7px
}
.avatar-icon{position:relative;z-index:2}.avatar-icon svg{width:21px;height:21px}
.bot-name{
  display:flex;align-items:center;gap:7px;font-size:13px;font-weight:850;margin:0 0 8px;color:#3c1423
}
.bot-name::after{
  content:none;font-size:9px;letter-spacing:.07em;text-transform:uppercase;
  color:#9f1239;background:#fff0f4;border:1px solid #ffd4df;border-radius:999px;padding:3px 6px
}
.answer{
  font-size:15.5px;line-height:1.72;color:#30262c;
  padding-right:6px
}
.thinking i{background:#c51a48}
.action.reveal{
  display:inline-flex;align-items:center;gap:7px;margin-top:3px;
  border:1px solid rgba(212,17,63,.18);background:#fff5f7;color:#981037;
  border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800
}
.action.reveal:hover{background:#ffe9ef;color:#760b2a}
.action.reveal::before{
  content:"⚠";display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;
  background:#d4113f;color:#fff;font-size:10px
}
.reveal-panel{
  position:relative;overflow:hidden;margin-top:15px;
  border:1px solid rgba(212,17,63,.22);
  background:linear-gradient(135deg,#fff2f5 0%,#fff 55%,#f8f0ff 100%);
  border-radius:16px;padding:14px 15px 14px 48px;font-size:12px;line-height:1.55;color:#641126;
  box-shadow:0 10px 30px rgba(117,12,52,.07)
}
.reveal-panel::before{
  content:"⚠";position:absolute;left:14px;top:13px;width:24px;height:24px;border-radius:8px;
  display:grid;place-items:center;background:#d4113f;color:#fff;font-size:13px;font-weight:900;
  box-shadow:0 5px 12px rgba(196,20,60,.2)
}
.reveal-panel::after{
  content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,#d4113f,#ff315b 45%,#7413b8)
}
.turn.revealed .answer{
  position:relative;background:rgba(255,251,252,.62);border-radius:12px
}
.turn.revealed .answer::before{
  content:"QUELLENSPUR";display:block;margin:0 0 8px;
  color:#9f1239;font-size:9px;font-weight:900;letter-spacing:.13em
}
.source-run{border-radius:4px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hallu-run{
  position:relative;border-radius:4px;padding:1px 3px;
  box-shadow:inset 0 -3px 0 #e5164e;
  background-image:linear-gradient(to top,rgba(229,22,78,.10),transparent 70%);
  box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.hallu-run::after{
  content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;
  background:repeating-linear-gradient(90deg,#d4113f 0 5px,transparent 5px 8px);
  opacity:.7
}
.cite{
  height:22px;min-width:30px;border-color:rgba(117,19,184,.15);
  box-shadow:0 2px 6px rgba(56,19,77,.06)
}
.cite.h{
  border-color:#ef9cb2;background:#fff0f4;color:#8b0a2d;
  box-shadow:0 0 0 2px rgba(212,17,63,.04)
}
.sources{margin-top:13px}
.source-card{
  border-color:#eee2e8;border-left-width:5px;border-radius:14px;
  box-shadow:0 6px 18px rgba(70,26,49,.04);background:rgba(255,255,255,.9)
}
.drawer{
  background:#fffafb;border-left:1px solid rgba(196,20,60,.13);
  box-shadow:-20px 0 50px rgba(83,12,45,.14)
}
.drawer-head{
  border-bottom:1px solid rgba(196,20,60,.1);
  background:linear-gradient(100deg,#fff4f7,#fff 55%,#f8f2ff)
}
.drawer-head h2{display:flex;align-items:center;gap:8px;color:#49162a}
.doc-search{border-color:#eadbe3;background:white}
.doc-search:focus{border-color:#df7291;box-shadow:0 0 0 3px rgba(212,17,63,.06)}
.doc-item{border-bottom-color:#f1e6eb}
.doc-item button:hover b{color:#a30f38}
.doc-back{background:#fff0f4;color:#871031}
.hallu-legend{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px;color:#796a73;font-size:10.5px
}
.legend-item{display:inline-flex;align-items:center;gap:5px}
.legend-swatch{width:17px;height:8px;border-radius:4px;background:#eadff6}
.legend-swatch.hallu{
  background:#ffe1e9;border-bottom:3px solid #e5164e;height:10px
}
@keyframes alarmGlow{
  0%,100%{box-shadow:0 18px 44px rgba(158,14,63,.19)}
  50%{box-shadow:0 18px 48px rgba(158,14,63,.28),0 0 0 7px rgba(212,17,63,.025)}
}
.hero-symbol{animation:alarmGlow 3.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .hero-symbol{animation:none}.thinking i{animation:none}.answer-text.generating::after{animation:none}
}
@media(max-width:640px){
  .topbar{height:56px;padding:0 11px}.topbar-brand span:last-child{display:none}
  .hero{padding:42px 0 20px}.hero-symbol{width:62px;height:62px;border-radius:20px;margin-bottom:14px}
  .hero-icon svg{width:33px;height:33px}.hero h1{font-size:48px}
  .hero-sub{font-size:13px;padding:0 12px}.hero-badges{margin-top:13px}
  .bot-row{grid-template-columns:34px minmax(0,1fr)}.avatar{width:32px;height:32px;border-radius:11px}
  .avatar-icon svg{width:18px;height:18px}.bot-name::after{display:none}
  .reveal-panel{padding-left:45px}
}


/* =========================================================
   HALLUBOT // Halluzination raten
   ========================================================= */
.guess-panel{
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0 2px;
  padding:9px 11px;border:1px dashed rgba(117,19,184,.24);border-radius:12px;
  background:linear-gradient(90deg,rgba(247,239,255,.7),rgba(255,245,247,.65));
  color:#63535e;font-size:11.5px;line-height:1.35
}
.guess-panel[hidden]{display:none}
.guess-icon{
  width:24px;height:24px;display:grid;place-items:center;flex:0 0 auto;
  border-radius:8px;background:#fff;color:#8c1743;border:1px solid #edd4df;
  font-size:13px;font-weight:900
}
.guess-copy{min-width:180px;flex:1}
.guess-copy b{color:#431828}
.guess-state{
  display:inline-flex;align-items:center;min-height:25px;padding:4px 8px;
  border-radius:999px;background:#fff;color:#806f79;border:1px solid #eee1e7;
  font-size:10.5px;font-weight:760
}
.guess-state.has-guess{background:#f6edff;color:#6e238f;border-color:#dfc6ef}

.sentence-guess{
  all:unset;display:inline;cursor:pointer;border-radius:6px;padding:2px 3px;margin:-2px -3px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
  transition:background .14s ease,box-shadow .14s ease,color .14s ease;
}
@media(hover:hover) and (pointer:fine){
  .sentence-guess:hover{
    background:rgba(117,19,184,.07);
    box-shadow:0 0 0 2px rgba(117,19,184,.07)
  }
}
.sentence-guess:focus-visible{
  outline:2px solid #8a23b0;outline-offset:3px
}
.sentence-guess.selected{
  background:linear-gradient(180deg,rgba(234,219,255,.72),rgba(246,235,255,.95));
  box-shadow:0 0 0 2px rgba(117,19,184,.28);
  color:#44234f
}
.sentence-guess.locked{cursor:default}

.guess-result{
  display:none;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;
  border-radius:13px;font-size:12px;font-weight:720;line-height:1.4
}

.guess-result.correct{
  background:#effaf3;border:1px solid #bfe7ca;color:#1d6635
}
.guess-result.wrong{

}
.guess-result.neutral{
  background:#f6f3f5;border:1px solid #e6dde2;color:#6f626a
}
.guess-result-icon{
  width:28px;height:28px;display:grid;place-items:center;flex:0 0 auto;
  border-radius:50%;font-size:15px;font-weight:950
}
.guess-result.correct .guess-result-icon{background:#d7f3df;color:#197339}
.guess-result.wrong .guess-result-icon{background:#ffead0;color:#9a5b13}
.guess-result.neutral .guess-result-icon{background:#ebe5e9;color:#756970}

.sentence-result{
  position:relative;border-radius:7px;padding:2px 3px;margin:-2px -3px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.sentence-result.guess-wrong{

}
.sentence-result.guess-correct{

}
.sentence-result.actual-hallu{
  background-image:linear-gradient(180deg,rgba(255,255,255,0),rgba(212,17,63,.035))
}

/* Erfolgsanimation */
.bot-content{position:relative}
.celebration{
  position:absolute;pointer-events:none;left:0;right:0;top:18px;height:130px;
  overflow:visible;opacity:0;z-index:8
}
.celebration i{
  position:absolute;left:50%;top:48%;width:8px;height:8px;border-radius:2px;
  background:#28a653;opacity:0
}
.celebration i:nth-child(2n){background:#cf1748;border-radius:50%}
.celebration i:nth-child(3n){background:#7b20a8}
.celebration i:nth-child(4n){width:5px;height:11px}
.turn.celebrate .celebration{opacity:1}
.turn.celebrate .celebration i{animation:confettiPop 900ms cubic-bezier(.12,.72,.25,1) both}
.turn.celebrate .celebration i:nth-child(1){--x:-128px;--y:-66px;--r:160deg;animation-delay:0ms}
.turn.celebrate .celebration i:nth-child(2){--x:-92px;--y:-94px;--r:-120deg;animation-delay:45ms}
.turn.celebrate .celebration i:nth-child(3){--x:-55px;--y:-61px;--r:210deg;animation-delay:90ms}
.turn.celebrate .celebration i:nth-child(4){--x:-22px;--y:-101px;--r:-180deg;animation-delay:25ms}
.turn.celebrate .celebration i:nth-child(5){--x:28px;--y:-86px;--r:135deg;animation-delay:70ms}
.turn.celebrate .celebration i:nth-child(6){--x:67px;--y:-69px;--r:-220deg;animation-delay:15ms}
.turn.celebrate .celebration i:nth-child(7){--x:104px;--y:-96px;--r:175deg;animation-delay:105ms}
.turn.celebrate .celebration i:nth-child(8){--x:137px;--y:-55px;--r:-145deg;animation-delay:55ms}
.turn.celebrate .celebration i:nth-child(9){--x:-116px;--y:12px;--r:230deg;animation-delay:110ms}
.turn.celebrate .celebration i:nth-child(10){--x:-71px;--y:27px;--r:-170deg;animation-delay:35ms}
.turn.celebrate .celebration i:nth-child(11){--x:72px;--y:20px;--r:190deg;animation-delay:80ms}
.turn.celebrate .celebration i:nth-child(12){--x:121px;--y:7px;--r:-210deg;animation-delay:120ms}
.turn.celebrate .guess-result.correct .guess-result-icon{animation:successBounce 650ms cubic-bezier(.2,.8,.25,1)}
.turn.celebrate .answer{animation:successGlow 850ms ease both}

@keyframes confettiPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(0)}
  12%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--r))}
}
@keyframes successBounce{
  0%{transform:scale(.5) rotate(-12deg)}
  55%{transform:scale(1.25) rotate(5deg)}
  100%{transform:scale(1) rotate(0)}
}
@keyframes successGlow{
  0%{filter:none}
  40%{filter:drop-shadow(0 0 10px rgba(34,197,94,.28))}
  100%{filter:none}
}
@media(prefers-reduced-motion:reduce){
  .turn.celebrate .celebration{display:none}
  .turn.celebrate .guess-result.correct .guess-result-icon,
  .turn.celebrate .answer{animation:none}
}

<script>
const rawDocs = [["D01","Grundteig: Mehl, Ei, Milch","Grundlagen","Ein klassischer Eierkuchenteig besteht häufig aus Mehl, Eiern, Milch und einer kleinen Menge Salz. Die Zutaten werden zu einem glatten, gießfähigen Teig verrührt. Je nach gewünschter Dicke kann etwas mehr oder weniger Flüssigkeit verwendet werden. Beim Rühren sollte trockenes Mehl vollständig aufgenommen werden. Zu starkes und langes Rühren kann die Kleberstruktur im Weizenmehl kräftigen. Eine kurze Ruhezeit kann dafür sorgen, dass sich Mehlbestandteile gleichmäßiger mit Flüssigkeit verbinden. Gebacken wird portionsweise in einer vorgeheizten Pfanne. Fettmenge, Pfannentemperatur und Teigdicke beeinflussen Bräunung, Elastizität und Garzeit. Ein festes Universalverhältnis gibt es nicht. Mehlmenge, Flüssigkeitsmenge und gewünschte Dicke bestimmen gemeinsam, wie gießfähig der Teig ist."],["D02","Ruhezeit des Teigs","Technik","Eine Ruhezeit ist bei Eierkuchenteig nicht zwingend, kann aber die Verarbeitung verbessern. Während des Ruhens nimmt Mehl weiter Flüssigkeit auf. Ein Teig kann dadurch gleichmäßiger und etwas weniger klumpig wirken. Bei Weizenmehl kann sich die zuvor beanspruchte Kleberstruktur entspannen. Viele Rezepte lassen den Teig ungefähr zehn bis dreißig Minuten stehen. Sehr lange Standzeiten bei Raumtemperatur sind wegen der enthaltenen Eier und Milch nicht sinnvoll. Wird der Teig später verwendet, gehört er abgedeckt in den Kühlschrank. Vor dem Backen kann kurzes Umrühren nötig sein, weil sich Bestandteile absetzen können."],["D03","Warum Eierkuchen zäh werden","Fehleranalyse","Zähe Eierkuchen können mehrere Ursachen haben. Wird Weizenteig sehr lange oder kräftig gerührt, kann sich ein stärkeres Klebergerüst bilden. Auch ein hoher Mehlanteil im Verhältnis zur Flüssigkeit macht den Teig fester. Zu lange Backzeiten treiben zusätzlich Feuchtigkeit aus dem Gebäck. Für weichere Ergebnisse hilft meist ein fließfähiger Teig, nur so viel Rühren wie nötig und eine Backzeit, die zur Dicke passt. Eierkuchen sollten vollständig gar sein, müssen aber nicht trocken gebacken werden. Unterschiedliche Mehlsorten reagieren verschieden. Deshalb ist es sinnvoll, Konsistenz und Pfannentemperatur zu beobachten statt sich ausschließlich auf Minutenangaben zu verlassen. Mehlmenge, Flüssigkeitsmenge und gewünschte Dicke bestimmen gemeinsam, wie gießfähig der Teig ist. Mehlmenge, Flüssigkeit und Rührintensität beeinflussen gemeinsam die Stärke der Teigstruktur. Kurzes Rühren kann die Teigstruktur weniger stark ausbilden. Kräftiges Rühren kann Eierkuchen zäher machen."],["D04","Pfannentemperatur","Technik","Die Pfannentemperatur beeinflusst, wie schnell ein Eierkuchen bräunt und fest wird. Ist die Pfanne zu kalt, bleibt der Teig länger weich und kann mehr Fett aufnehmen. Ist sie zu heiß, kann die Außenseite dunkel werden, bevor die Mitte ausreichend gegart ist. Mittlere bis mittelhohe Hitze ist für viele dünne Eierkuchen ein praktikabler Ausgangspunkt. Die genaue Einstellung hängt von Herd, Pfanne, Teigdicke und Fett ab. Ein kleiner Probefleck Teig kann helfen, die Temperatur einzuschätzen. Nach mehreren Eierkuchen muss die Hitze manchmal angepasst werden, weil sich Pfanne und Herd im Betrieb weiter erwärmen. Pfannentemperatur, Fettfilm und Garzeit beeinflussen gemeinsam Bräunung und Anhaften. Zu niedrige Hitze kann die Bräunung verlangsamen. Eine zu kalte Pfanne kann das Ablösen erschweren."],["D05","Wenden ohne Zerreißen","Technik","Ein Eierkuchen lässt sich leichter wenden, wenn die Unterseite bereits stabil ist und die Oberseite nicht mehr vollständig flüssig aussieht. Ein dünner Pfannenwender kann vorsichtig unter den Rand geschoben werden. Bei beschichteten Pfannen sollte ein Material verwendet werden, das die Oberfläche nicht beschädigt. Große, sehr dünne Eierkuchen reißen leichter, wenn sie zu früh angehoben werden. Auch ein stark klebender Pfannenboden erschwert das Wenden. Etwas Fett und eine passende Temperatur helfen. Wer unsicher ist, kann kleinere Eierkuchen backen. Das spektakuläre Wenden durch Hochwerfen ist nicht nötig und erhöht das Risiko von Verschütten oder Verbrennungen. Ein Eierkuchen löst sich leichter, wenn die Unterseite ausreichend gegart und stabil ist. Eine noch instabile Unterseite kann das Wenden erschweren."],["D06","Butter, Öl und Butterschmalz","Zutaten","Butter liefert typisches Aroma, enthält aber neben Fett auch Wasser und Milchbestandteile, die bei hoher Hitze bräunen können. Butterschmalz besteht weitgehend aus Milchfett und verträgt in der Pfanne in der Regel höhere Temperaturen als normale Butter. Neutrale Pflanzenöle können ebenfalls zum Ausbacken dienen. Welche Fettart sinnvoll ist, hängt vom gewünschten Geschmack und der verwendeten Hitze ab. Sehr große Fettmengen sind für einen dünnen Eierkuchen meist nicht notwendig. Die Pfanne sollte lediglich ausreichend benetzt sein. Bei beschichteten Pfannen kann oft mit wenig Fett gearbeitet werden, sofern die Beschichtung intakt und für das Braten geeignet ist."],["D07","Milch und Alternativen","Zutaten","Milch liefert Flüssigkeit, Eiweiß, Milchzucker und Mineralstoffe. Für Eierkuchenteig lässt sie sich grundsätzlich auch durch geeignete Pflanzendrinks ersetzen. Hafer-, Soja- oder Mandeldrinks unterscheiden sich in Geschmack, Eiweißgehalt, Süße und Verhalten beim Erhitzen. Ungesüßte Varianten sind für herzhafte Rezepte oft leichter einzuplanen. Pflanzendrinks machen einen Teig nicht automatisch vegan, solange Eier enthalten sind. Wer Kuhmilch vermeiden muss, sollte außerdem auf weitere Milchbestandteile im Rezept achten. Die benötigte Flüssigkeitsmenge kann je nach Mehl und Getränk etwas variieren. Entscheidend ist am Ende eine zur gewünschten Eierkuchendicke passende, gießfähige Konsistenz. Laktosefreie Kuhmilch lässt sich in vielen Eierkuchenrezepten ähnlich wie normale Milch einsetzen; durch die Spaltung der Laktose kann sie etwas süßer schmecken. Art und Menge der Flüssigkeit beeinflussen, wie dünn der Teig ist und wie gut er in der Pfanne zerläuft. Milch und Pflanzendrinks lassen sich in vielen Rezepten austauschen, verhalten sich aber nicht völlig identisch. Eine kleinere Milchmenge kann den Teig dicker machen."],["D08","Mineralwasser im Teig","Zutaten","Sprudelndes Mineralwasser kann einen Teil der Flüssigkeit im Eierkuchenteig ersetzen. Die gelöste Kohlensäure und das schnelle Entweichen von Gas können den Teig beim Ausbacken etwas lockerer wirken lassen. Der Effekt hängt jedoch von Rezept, Teigdicke und Verarbeitung ab. Mineralwasser verändert den Proteingehalt des Teigs nicht wesentlich, wenn lediglich Wasser ersetzt wird. Ein stark salzhaltiges Mineralwasser kann den Geschmack beeinflussen. Häufig wird nur ein Teil der Milch oder anderer Flüssigkeit durch Sprudel ersetzt. Der Teig sollte nach dem Einrühren nicht unnötig lange stehen, wenn der lockerende Effekt der Kohlensäure genutzt werden soll. Gasblasen können den Teig lockern; ihre Wirkung hängt von Teigdicke, Bindung und Verarbeitung ab. Mehr Mineralwasser kann den Proteingehalt nicht erhöhen. Mehr proteinfreie Flüssigkeit kann den Proteingehalt nicht erhöhen."],["D09","Backpulver: wann sinnvoll?","Zutaten","Backpulver ist ein chemisches Triebmittel, das beim Befeuchten und Erhitzen Gas freisetzt. In dicken Pfannkuchen kann es für mehr Volumen sorgen. Klassische dünne deutsche Eierkuchen benötigen dagegen nicht zwingend Backpulver. Wird es verwendet, sollte die Menge zum Mehl passen, weil zu viel Triebmittel Geschmack und Struktur beeinträchtigen kann. Backpulver ist ein Produkt der modernen Lebensmittelchemie und wurde im 19. Jahrhundert verbreitet. Es ist daher kein traditionelles Triebmittel der Antike. Ob es in ein Eierkuchenrezept gehört, ist vor allem eine Stilfrage: dünn und flexibel oder dicker und stärker gelockert. Gasblasen können den Teig lockern; ihre Wirkung hängt von Teigdicke, Bindung und Verarbeitung ab. Dünne Eierkuchen brauchen nicht zwingend ein Triebmittel, während dickere Varianten stärker davon profitieren können."],["D10","Natron und Säure","Zutaten","Natron ist Natriumhydrogencarbonat. Als Triebmittel funktioniert es besonders gut, wenn im Teig ausreichend Säure vorhanden ist, etwa durch Buttermilch oder Joghurt. Bei der Reaktion entsteht Kohlendioxid, das Teige lockern kann. Fehlt Säure, kann ein unangenehm alkalischer Geschmack zurückbleiben. Natron und Backpulver sind deshalb nicht in jedem Rezept ohne Anpassung austauschbar. Dünne Eierkuchen brauchen üblicherweise überhaupt kein starkes Triebmittel. Wer Natron verwendet, sollte sich an ein erprobtes Rezept halten. Die chemische Reaktion beginnt nach dem Vermischen, weshalb solche Teige normalerweise nicht unbegrenzt vor dem Backen stehen sollten. Gasblasen können den Teig lockern; ihre Wirkung hängt von Teigdicke, Bindung und Verarbeitung ab."],["D11","Eier: Bindung und Struktur","Zutaten","Eier übernehmen in Eierkuchen mehrere Aufgaben. Ihre Proteine gerinnen beim Erhitzen und tragen zur Stabilität des gebackenen Teigs bei. Eigelb enthält außerdem Fett und Emulgatoren, die die Verteilung von Fett und Wasser unterstützen können. Mehr Ei führt nicht automatisch zu einem besseren Eierkuchen; es verändert Geschmack, Farbe und Struktur. Für vegane Varianten müssen deshalb mehrere Funktionen ersetzt oder durch ein anderes Rezeptkonzept ausgeglichen werden. Rohe Eier können Krankheitserreger enthalten. Teig mit rohem Ei sollte nicht ungekühlt lange stehen oder roh probiert werden. Durch ausreichendes Erhitzen sinkt das mikrobiologische Risiko deutlich. Weniger Ei kann den Eiergeschmack verringern. Ein Teig mit Ei kann nicht vegan sein. Eierkuchen mit Ei sind nicht vegan. Ein eihaltiger Teig kann tierisch bleiben."],["D12","Weizenmehl und Gluten","Mehl","Weizenmehl enthält Proteine, aus denen sich mit Wasser und Bewegung ein Klebergerüst, Gluten genannt, entwickeln kann. Dieses Netzwerk gibt Teigen Elastizität und Zusammenhalt. Bei Eierkuchen ist etwas Struktur nützlich, zu starke Entwicklung kann dünne Exemplare jedoch zäher machen. Vollkornweizenmehl enthält ebenfalls Gluten und ist nicht für Menschen mit Zöliakie geeignet. Es bringt zusätzlich Randschichten und Keimanteile des Korns in den Teig. Dadurch bindet es oft mehr Flüssigkeit und schmeckt kräftiger. Wer glutenfrei backen muss, benötigt geeignete glutenfreie Mehle und sollte auf Verunreinigungen achten. Die Rezeptur muss dann häufig angepasst werden. Mehlmenge, Flüssigkeit und Rührintensität beeinflussen gemeinsam die Stärke der Teigstruktur. Weizen- und Dinkelmehl können Gluten bilden; sehr kräftiges Rühren kann dünne Eierkuchen zäher machen."],["D13","Dinkelmehl im Eierkuchen","Mehl","Dinkel ist eine Weizenart und enthält Gluten. Dinkelmehl kann in vielen Eierkuchenrezepten anstelle von Weizenmehl verwendet werden, verhält sich aber nicht völlig identisch. Wasseraufnahme, Geschmack und Teigstabilität können sich je nach Mehltype unterscheiden. Ein Teig sollte daher nach Konsistenz beurteilt und bei Bedarf mit etwas Flüssigkeit oder Mehl angepasst werden. Dinkel ist keine glutenfreie Alternative für Menschen mit Zöliakie. Wie bei anderen Mehlen beeinflusst der Ausmahlungsgrad den Anteil an Randschichten und damit Geschmack, Farbe und Nährstoffprofil. Für dünne Eierkuchen eignen sich sowohl helle als auch vollkornreiche Varianten, wenn die Flüssigkeitsmenge angepasst wird."],["D14","Buchweizen","Mehl","Buchweizen ist botanisch kein Getreide, sondern ein Knöterichgewächs. Das Mehl ist von Natur aus glutenfrei und hat einen charakteristischen, leicht nussigen Geschmack. In der französischen Bretagne werden herzhafte Galettes traditionell mit Buchweizen in Verbindung gebracht. Reiner Buchweizenteig verhält sich anders als Weizenteig, weil das Gluten als elastisches Netzwerk fehlt. Rezepte gleichen das durch andere Zutaten und angepasste Verarbeitung aus. Wer wegen Zöliakie glutenfrei essen muss, sollte zusätzlich auf als glutenfrei gekennzeichnete Produkte und mögliche Kreuzkontamination achten. Buchweizen liefert unter anderem Stärke, Eiweiß, Ballaststoffe und verschiedene Mineralstoffe, ist aber kein Garant für ein kalorienarmes Gericht. Mehlsorte und Wasseraufnahme beeinflussen die benötigte Flüssigkeitsmenge im Eierkuchenteig. Glutenfreie Mehle bilden kein Weizengluten und benötigen je nach Rezept eine angepasste Bindung. Buchweizen ist bei Zöliakie geeignet, wenn er sicher glutenfrei verarbeitet wurde. Buchweizenmehl kann kein Gluten bilden. Buchweizenmehl gilt als glutenfrei. Im Vergleich zu Dinkel enthält Buchweizen kein Gluten."],["D15","Hafer im Eierkuchen","Mehl","Haferflocken oder Hafermehl können Eierkuchenteig ergänzen oder teilweise die Mehlbasis bilden. Hafer bringt einen deutlichen Eigengeschmack und lösliche Ballaststoffe, darunter Beta-Glucane, mit. Für Menschen mit Zöliakie ist entscheidend, speziell als glutenfrei gekennzeichneten Hafer zu verwenden, weil normaler Hafer häufig mit glutenhaltigem Getreide verunreinigt ist. Manche Menschen mit Zöliakie vertragen zudem Avenin, das Haferprotein, nicht gut. Gemahlene Haferflocken binden Flüssigkeit und können den Teig dicker machen. Eine kurze Quellzeit verändert deshalb die Konsistenz. Je nach Rezept sind Eier, Milch oder pflanzliche Bindemittel weiterhin nötig. Mehlsorte und Wasseraufnahme beeinflussen die benötigte Flüssigkeitsmenge im Eierkuchenteig."],["D16","Glutenfreie Mehlmischungen","Mehl","Glutenfreie Eierkuchen können aus Reis-, Mais-, Buchweizen-, Hirse- oder anderen geeigneten Mehlen hergestellt werden. Weil Gluten als elastische Struktur fehlt, arbeiten viele Rezepte mit Mischungen aus Mehlen und Stärken. Eier können zusätzlich Bindung geben. Bei veganen glutenfreien Varianten helfen je nach Rezept beispielsweise gemahlene Leinsamen, Flohsamenschalen oder Stärke. Solche Zutaten sind nicht beliebig austauschbar, weil sie unterschiedlich viel Wasser binden. Ein Teig, der zu dick wirkt, kann vorsichtig mit Flüssigkeit angepasst werden. Für Menschen mit Zöliakie ist neben der Zutatenwahl auch die Vermeidung von Kreuzkontamination durch Arbeitsflächen, Geräte und Vorräte wichtig. Mandelmehl ist ebenfalls glutenfrei, verhält sich wegen seines höheren Fett- und geringeren Stärkeanteils aber anders als Reis- oder Weizenmehl und wird deshalb meist nicht ohne Rezeptanpassung eins zu eins ersetzt. Mehlsorte und Wasseraufnahme beeinflussen die benötigte Flüssigkeitsmenge im Eierkuchenteig. Glutenfreie Mehle bilden kein Weizengluten und benötigen je nach Rezept eine angepasste Bindung."],["D17","Vegane Eierkuchen","Varianten","Vegane Eierkuchen kommen ohne Eier und andere tierische Zutaten aus. Häufig werden Pflanzendrinks als Flüssigkeit eingesetzt. Bindung kann je nach Rezept durch Mehlstärke, gemahlene Leinsamen, Banane, Apfelmus oder spezielle Ei-Ersatzprodukte entstehen. Diese Varianten schmecken und bräunen unterschiedlich. Banane und Apfelmus bringen beispielsweise Eigengeschmack und Zucker mit, während Leinsamen eher neutraler eingesetzt werden können. Ein veganes Rezept ist nicht automatisch glutenfrei oder besonders kalorienarm. Für gute Ergebnisse lohnt es sich, ein dafür entwickeltes Rezept zu verwenden statt in einem klassischen Rezept mehrere zentrale Zutaten gleichzeitig ohne Anpassung auszutauschen. Pfannentemperatur und Teigkonsistenz bleiben wichtige Faktoren. Der Austausch einzelner Zutaten verändert Bindung, Feuchtigkeit und Geschmack und funktioniert nicht in jedem Rezept identisch. Ein Teig mit Ei ist in dieser Form nicht vegan. Ein Teig ohne Ei kann vegan sein. Vegane Eierkuchen gelingen ohne Ei und andere tierische Zutaten. Ein pflanzlicher Teig kann vegan bleiben."],["D18","Leinsamen als Ei-Ersatz","Varianten","Geschrotete oder gemahlene Leinsamen können mit Wasser eine gelartige Masse bilden. In manchen veganen Teigen unterstützt diese Mischung die Bindung. Sie bildet jedoch die Eigenschaften eines Hühnereis nicht vollständig nach. Farbe, Geschmack, Proteinmenge und Struktur unterscheiden sich. Häufig wird die Mischung einige Minuten quellen gelassen, bevor sie in den Teig kommt. Zu viel Leinsamen kann den Teig schwer oder deutlich körnig machen. Für sehr feine, dünne Eierkuchen sind deshalb passende Mengen wichtig. Leinsamen enthalten Fett und Ballaststoffe. Gemahlene Samen werden wegen ihrer größeren Oberfläche schneller ranzig als ganze Samen und sollten entsprechend kühl und geschützt gelagert werden. Der Austausch einzelner Zutaten verändert Bindung, Feuchtigkeit und Geschmack und funktioniert nicht in jedem Rezept identisch."],["D19","Banane im Teig","Varianten","Zerdrückte Banane kann in süßen Pfannkuchenrezepten Feuchtigkeit, Süße und etwas Bindung beitragen. Sie verleiht dem Teig aber einen klaren Bananengeschmack und kann die Bräunung durch enthaltene Zucker fördern. Als Ersatz für Ei funktioniert sie nicht in jedem klassischen Eierkuchenrezept gleich gut. Besonders bei sehr dünnen Eierkuchen kann ein speziell auf Banane abgestimmtes Rezept sinnvoller sein. Reife Bananen sind süßer und weicher als unreife. Zusätzlicher Zucker kann je nach Rezept reduziert werden, muss aber nicht zwingend entfallen. Banane macht ein Gericht weder automatisch vegan noch glutenfrei; dafür müssen alle übrigen Zutaten ebenfalls passend gewählt werden. Der Austausch einzelner Zutaten verändert Bindung, Feuchtigkeit und Geschmack und funktioniert nicht in jedem Rezept identisch."],["D20","Apfelmus im Teig","Varianten","Ungesüßtes Apfelmus kann in manchen süßen Pfannkuchenrezepten einen Teil von Ei oder Fett ersetzen und bringt Feuchtigkeit sowie Fruchtzucker mit. Es verändert den Geschmack und kann den Teig weicher machen. Als alleiniger Ersatz für Ei ist es nicht für jedes dünne Eierkuchenrezept geeignet, weil Ei auch Struktur durch gerinnende Proteine liefert. Bei größeren Austauschmengen muss die Rezeptur angepasst werden. Gesüßtes Apfelmus erhöht die Zuckermenge zusätzlich. Für herzhafte Eierkuchen ist die fruchtige Note nicht immer erwünscht. Wer mit Apfelmus experimentiert, sollte zunächst eine kleine Portion backen und danach Flüssigkeitsmenge, Mehlanteil oder Backzeit anpassen. Der Austausch einzelner Zutaten verändert Bindung, Feuchtigkeit und Geschmack und funktioniert nicht in jedem Rezept identisch."],["D21","Süße Beläge","Servieren","Zu Eierkuchen passen viele süße Beläge: frisches Obst, Kompott, Apfelmus, Konfitüre, Zimt und Zucker, Joghurt, Quark oder Nussmus. Sirupe und Schokoladencremes enthalten häufig viel freien beziehungsweise zugesetzten Zucker und erhöhen die Energiedichte einer Portion. Obst liefert neben Zucker auch Wasser, Ballaststoffe, Vitamine und sekundäre Pflanzenstoffe. Die Nährwerte des fertigen Gerichts hängen deshalb nicht nur vom Teig, sondern stark von Belag und Portionsgröße ab. Ein süßer Eierkuchen kann Teil einer ausgewogenen Ernährung sein, ohne dass einzelne Zutaten pauschal als gesund oder ungesund eingestuft werden müssen. Häufigkeit und Gesamtzusammenhang der Ernährung sind wichtiger. Auch Honig oder Nuss-Nougat-Creme können als süße Beläge verwendet werden; ihre Zuckermenge bleibt für die Gesamtbilanz der Portion relevant. Rezept, Portionsgröße und Belag bestimmen gemeinsam die Nährwerte einer Eierkuchenportion. Eine einzelne Zutat entscheidet nicht allein darüber, wie ausgewogen die gesamte Portion ist. Belag und Füllung verändern Geschmack, Feuchtigkeit und Nährwerte des fertigen Gerichts. Eine kleinere Portion kann die Energiemenge verringern. Mehr süßer Belag kann die Zuckermenge erhöhen. Ob Eierkuchen gesund oder ausgewogen sind, hängt nicht von einer einzigen Zutat ab. Für die gesundheitliche Bewertung sind Rezept, Portionsgröße und Belag gemeinsam wichtig."],["D22","Herzhafte Füllungen","Servieren","Herzhafte Eierkuchen lassen sich mit Gemüse, Pilzen, Kräutern, Käse, Hülsenfrüchten, Fisch oder Fleisch kombinieren. Feuchte Füllungen sollten nicht so wasserreich sein, dass der Eierkuchen sofort durchweicht. Gemüse kann je nach Sorte roh, gedünstet oder gebraten verwendet werden. Käse bringt Eiweiß, Fett und Salz mit und schmilzt bei Wärme. Hülsenfrüchte liefern pflanzliches Eiweiß und Ballaststoffe. Fleisch und Fisch müssen passend zur jeweiligen Sorte sicher gegart und gelagert werden. Eine Füllung kann einen Eierkuchen ernährungsphysiologisch deutlich verändern. Deshalb lässt sich die Frage nach „gesund“ nicht allein anhand des Teigs beantworten. Auch Portionsgröße und Beilagen spielen eine Rolle. Zu typischen herzhaften Kombinationen zählen außerdem Spinat, Schinken, Tomaten, Frischkäse, Avocado, Räucherlachs oder gegartes Hähnchen. Rezept, Portionsgröße und Belag bestimmen gemeinsam die Nährwerte einer Eierkuchenportion. Eine einzelne Zutat entscheidet nicht allein darüber, wie ausgewogen die gesamte Portion ist. Belag und Füllung verändern Geschmack, Feuchtigkeit und Nährwerte des fertigen Gerichts."],["D23","Zimt und Zucker","Servieren","Zimt und Zucker sind eine einfache, in Deutschland verbreitete süße Kombination für Eierkuchen. Zucker löst sich auf der warmen Oberfläche teilweise an und liefert vor allem Kohlenhydrate und Energie. Zimt bringt intensive Aromen mit, wird aber nur in kleinen Mengen verwendet. Cassia-Zimt enthält mehr Cumarin als Ceylon-Zimt. Bei sehr hohem, regelmäßigem Zimtkonsum kann Cumarin relevant werden, während übliche kleine Küchenmengen anders zu bewerten sind. Für Kinder und Erwachsene gilt deshalb: Gewürze sinnvoll dosieren und nicht große Mengen als Gesundheitsmittel verwenden. Zimt senkt den Energiegehalt des Zuckers nicht. Weniger Zucker erreicht man nur durch eine kleinere Zuckermenge oder andere Beläge."],["D24","Ahornsirup","Servieren","Ahornsirup wird aus dem Saft bestimmter Ahornarten hergestellt und eingekocht. Er besteht zu einem großen Teil aus Zucker und Wasser und liefert daher Energie. Kleine Mengen verschiedener Mineralstoffe ändern daran nichts grundsätzlich. Ahornsirup ist nicht zuckerfrei und wirkt auf den Blutzucker nicht wie reines Wasser. Geschmacklich unterscheidet er sich deutlich von Haushaltszucker und Honig. Für Eierkuchen wird er meist als Belag oder zum Süßen verwendet. Wer den Zuckerkonsum reduzieren möchte, sollte vor allem die verwendete Menge beachten. Dass ein Süßungsmittel „natürlich“ ist, bedeutet nicht automatisch, dass beliebige Mengen ernährungsphysiologisch günstig sind."],["D25","Obst als Belag","Servieren","Frisches Obst ergänzt Eierkuchen mit Wasser, Ballaststoffen, Vitaminen und vielfältigen Aromen. Beeren, Apfel, Birne, Banane oder Zitrusfrüchte unterscheiden sich in Säure, Süße und Textur. Ganze Früchte enthalten Ballaststoffe, die in Fruchtsaft weitgehend fehlen oder deutlich geringer konzentriert sind. Tiefgekühltes Obst kann ebenfalls nährstoffreich sein und ist außerhalb der Saison praktisch. Bei tiefgekühlten Beeren sollten die Hinweise des Herstellers zur sicheren Verwendung beachtet werden. Sehr saftiges Obst kann dünne Eierkuchen aufweichen, wenn es lange darauf liegt. Für ein ausgewogenes Gericht kann Obst mit einer Eiweißquelle wie Joghurt, Quark oder einer pflanzlichen Alternative kombiniert werden. Rezept, Portionsgröße und Belag bestimmen gemeinsam die Nährwerte einer Eierkuchenportion. Belag und Füllung verändern Geschmack, Feuchtigkeit und Nährwerte des fertigen Gerichts."],["D26","Nährwerte: keine feste Zahl","Ernährung","Für „einen Eierkuchen“ gibt es keinen einheitlichen Kalorien- oder Nährwert. Größe, Mehlmenge, Eier, Milch, Fett zum Ausbacken und Belag verändern die Bilanz erheblich. Ein kleiner dünner Eierkuchen aus wenig Fett unterscheidet sich deutlich von einem großen, dicken Pfannkuchen mit süßer Creme. Wer Nährwerte genau benötigt, muss Zutatenmengen, tatsächlichen Verbrauch und Portionszahl berücksichtigen. Pauschale Angaben aus dem Internet sind deshalb nur grobe Orientierung, wenn das Rezept nicht identisch ist. Für den Alltag ist oft hilfreicher, auf die Zusammensetzung der Mahlzeit zu schauen: Vollkornanteil, Obst oder Gemüse, Eiweißquellen, Fettmenge und Art des Belags. Rezept, Portionsgröße und Belag bestimmen gemeinsam die Nährwerte einer Eierkuchenportion. Eine einzelne Zutat entscheidet nicht allein darüber, wie ausgewogen die gesamte Portion ist. Eine größere Portion kann die Energiemenge erhöhen. Ob Eierkuchen gesund oder ausgewogen sind, hängt von Rezept, Portionsgröße und Belag ab. Für die gesundheitliche Bewertung sind Rezept, Portionsgröße und Belag gemeinsam wichtig."],["D27","Protein im Eierkuchen","Ernährung","Eierkuchen liefern je nach Rezept Protein aus Eiern, Milch und Getreide. Der genaue Gehalt hängt von den verwendeten Mengen und Produkten ab. Zusätzliche proteinreiche Zutaten wie Quark, Skyr, Sojajoghurt oder Hülsenfruchtfüllungen können den Proteingehalt einer Mahlzeit erhöhen. Mineralwasser dagegen enthält normalerweise praktisch kein Protein und verdoppelt den Proteingehalt eines Teigs nicht. Auch die Zahl der Eier verändert das Ergebnis, beeinflusst aber zugleich Geschmack, Fett und andere Nährstoffe. Für eine proteinreichere Ernährung ist die Gesamtzufuhr über den Tag entscheidend. Einzelne „High-Protein“-Rezepte sind nur ein möglicher Baustein und nicht für jede Person notwendig. Proteinpulver kann einen Teig proteinreicher machen, bindet je nach Produkt aber zusätzlich Flüssigkeit und kann die Konsistenz verändern. Rezept, Portionsgröße und Belag bestimmen gemeinsam die Nährwerte einer Eierkuchenportion. Eine einzelne Zutat entscheidet nicht allein darüber, wie ausgewogen die gesamte Portion ist. Mehr proteinreiche Zutaten können den Proteingehalt erhöhen."],["D28","Ballaststoffe","Ernährung","Ballaststoffe stammen vor allem aus pflanzlichen Lebensmitteln. In Eierkuchen lässt sich ihr Anteil beispielsweise durch Vollkornmehl, Hafer, gemahlene Samen, Nüsse, Obst oder Gemüse erhöhen. Weißmehl enthält weniger Ballaststoffe als das entsprechende Vollkornmehl. Ein höherer Ballaststoffanteil kann die Teigkonsistenz verändern, weil viele ballaststoffreiche Zutaten Wasser binden. Dann ist oft etwas mehr Flüssigkeit nötig. Ballaststoffe unterstützen unter anderem die Darmfunktion und tragen zur Sättigung bei. Eine plötzliche sehr starke Erhöhung kann bei manchen Menschen Blähungen verursachen. Deshalb ist eine schrittweise Steigerung zusammen mit ausreichend Flüssigkeit oft verträglicher als eine abrupte Umstellung. Rezept, Portionsgröße und Belag bestimmen gemeinsam die Nährwerte einer Eierkuchenportion. Eine einzelne Zutat entscheidet nicht allein darüber, wie ausgewogen die gesamte Portion ist. Mehr ballaststoffreiche Zutaten können den Ballaststoffgehalt erhöhen."],["D29","Fett und Bräunung","Ernährung","Fett in der Pfanne überträgt Wärme, verhindert Ankleben und beeinflusst Geschmack sowie Mundgefühl. Wie viel Fett tatsächlich im Eierkuchen landet, hängt von Pfanne, Teig, Temperatur und Menge ab. Ein Teil bleibt in der Pfanne zurück. Mehr Fett erhöht grundsätzlich die Energiedichte des Gerichts, auch wenn die exakte aufgenommene Menge schwer zu schätzen ist. Für das Braten eignen sich Fette, die zur verwendeten Temperatur passen. Butter schmeckt anders als neutrales Öl oder Butterschmalz. Ein Eierkuchen wird nicht kalorienärmer, nur weil er häufiger gewendet wird. Entscheidend sind Rezept, Fettaufnahme, Größe und Belag. Rezept, Portionsgröße und Belag bestimmen gemeinsam die Nährwerte einer Eierkuchenportion."],["D30","Salz im Teig","Ernährung","Eine kleine Menge Salz kann den Geschmack von Eierkuchenteig abrunden, auch bei süßen Varianten. Salz besteht hauptsächlich aus Natriumchlorid und liefert kein Fett. Es verändert daher nicht den Rauchpunkt von Butter um einen festen Temperaturwert. Wer aus gesundheitlichen Gründen Natrium reduzieren soll, kann die Salzmenge im Teig begrenzen und salzige Beläge berücksichtigen. Viele verarbeitete Lebensmittel enthalten deutlich mehr Salz als ein selbst gemachter Teig mit einer kleinen Prise. Geschmack lässt sich zusätzlich mit Kräutern, Gewürzen, Säure oder aromatischen Zutaten steuern. Eine exakte optimale Salzmenge existiert nicht, weil Rezeptmenge, Beläge und persönliche Vorlieben variieren. Mehr Salz kann den Geschmack salziger machen."],["D31","Lebensmittelsicherheit: roher Teig","Sicherheit","Roher Eierkuchenteig sollte nicht probiert werden. Rohe Eier können mit Krankheitserregern belastet sein, und auch rohes Mehl ist kein verzehrfertiges Produkt. Mehl kann während Anbau und Verarbeitung mit Keimen in Kontakt kommen. Durch ausreichendes Erhitzen werden viele Krankheitserreger zuverlässig reduziert. Kühlen verlangsamt das Wachstum mancher Mikroorganismen, sterilisiert Teig aber nicht. Reste mit rohem Ei und Milch sollten deshalb zügig gekühlt und nicht lange bei Raumtemperatur stehen gelassen werden. Arbeitsflächen und Geräte, die mit rohem Teig in Kontakt waren, sollten gereinigt werden. Besonders empfindliche Personen profitieren von sorgfältiger Küchenhygiene und vollständig gegarten Speisen. Hygiene, Temperatur und Lagerdauer beeinflussen gemeinsam Sicherheit und Qualität von Eierkuchen. Rohes Probieren kann das Infektionsrisiko erhöhen. Eine lange warme Standzeit kann die sichere Verarbeitung verschlechtern."],["D32","Aufbewahrung gebackener Eierkuchen","Sicherheit","Gebackene Eierkuchen lassen sich nach dem Abkühlen abgedeckt im Kühlschrank aufbewahren. Sie sollten nicht unnötig lange bei Raumtemperatur stehen, besonders wenn sie mit leicht verderblichen Füllungen kombiniert sind. Beim Wiedererwärmen ist gleichmäßiges Erhitzen sinnvoll. Qualität und Textur verändern sich im Kühlschrank: Eierkuchen können trockener oder fester werden. Für längere Lagerung können viele einfache Eierkuchen auch eingefroren werden. Zwischenlagen aus Backpapier erleichtern das spätere Trennen. Wie lange ein konkretes Produkt sicher und qualitativ gut bleibt, hängt von Zutaten, Hygiene, Kühltemperatur und Verpackung ab. Bei auffälligem Geruch, Schimmel oder deutlichen Verderbzeichen wird es entsorgt. Hygiene, Temperatur und Lagerdauer beeinflussen gemeinsam Sicherheit und Qualität von Eierkuchen. Kühlen oder Einfrieren machen bereits verdorbene Lebensmittel nicht wieder sicher. Kühle Lagerung kann die Haltbarkeit verlängern."],["D33","Einfrieren","Sicherheit","Schlichte, vollständig gebackene Eierkuchen lassen sich häufig gut einfrieren. Sie sollten zunächst abkühlen, dann portionsweise luftdicht verpackt werden. Backpapier zwischen einzelnen Stücken verhindert, dass sie zu einem Block zusammenfrieren. Füllungen mit viel Wasser oder empfindlicher Creme können nach dem Auftauen ihre Textur stärker verändern. Aufgetaut werden kann im Kühlschrank oder direkt beim Erwärmen, je nach Dicke und Rezept. Einfrieren stoppt mikrobielle Prozesse nicht vollständig, verlangsamt sie aber stark. Es macht bereits verdorbene Lebensmittel nicht wieder sicher. Beschriftung mit Datum hilft, den Überblick über den Vorrat zu behalten und ältere Portionen zuerst zu verwenden. Hygiene, Temperatur und Lagerdauer beeinflussen gemeinsam Sicherheit und Qualität von Eierkuchen. Kühlen oder Einfrieren machen bereits verdorbene Lebensmittel nicht wieder sicher. Warme Lagerung kann die Haltbarkeit verkürzen."],["D34","Allergene","Sicherheit","Klassische Eierkuchen enthalten häufig mehrere deklarationspflichtige Allergene, insbesondere glutenhaltiges Getreide, Ei und Milch. Nussmus, Sojadrinks oder andere Zutaten können weitere Allergene hinzufügen. Wer für Menschen mit einer Lebensmittelallergie kocht, muss nicht nur die Rezeptur, sondern auch Spuren und Kreuzkontakte beachten. Eine kleine Menge eines Allergens kann bei empfindlichen Personen schwere Reaktionen auslösen. Zutatenlisten und Kennzeichnungen sollten deshalb genau gelesen werden. „Vegan“ bedeutet zum Beispiel nicht automatisch glutenfrei oder nussfrei. Bei diagnostizierten Allergien sind individuelle medizinische Empfehlungen maßgeblich. In gemeinschaftlichen Küchen helfen getrennte Utensilien, saubere Flächen und klare Kennzeichnung der Zutaten. Bei Allergien und Zöliakie müssen Zutaten und mögliche Kreuzkontakte gemeinsam berücksichtigt werden."],["D35","Zöliakie und Küche","Sicherheit","Bei Zöliakie löst Gluten eine immunologische Reaktion aus, die den Dünndarm schädigen kann. Schon kleine Glutenmengen können relevant sein. Für glutenfreie Eierkuchen reichen daher glutenfreie Zutaten allein nicht immer aus, wenn Arbeitsflächen, Pfannenwender, Mixer oder Vorratsbehälter mit glutenhaltigem Mehl verunreinigt sind. Mehlstaub kann sich in Küchen verteilen. Separate oder gründlich gereinigte Geräte und klar getrennte Zutaten verringern das Risiko. Weizen, Roggen und Gerste sind glutenhaltig; Dinkel ist ebenfalls glutenhaltig. Buchweizen ist von Natur aus glutenfrei, muss bei Zöliakie aber trotzdem sicher verarbeitet und entsprechend gekennzeichnet sein. Individuelle Beratung kann zusätzlich sinnvoll sein. Bei Allergien und Zöliakie müssen Zutaten und mögliche Kreuzkontakte gemeinsam berücksichtigt werden. Dinkel ist bei Zöliakie nicht geeignet."],["D36","Begriff: Eierkuchen und Pfannkuchen","Kultur","Im Deutschen werden die Wörter Eierkuchen, Pfannkuchen, Palatschinke und weitere regionale Bezeichnungen unterschiedlich verwendet. In Berlin und Teilen Ostdeutschlands bezeichnet „Eierkuchen“ oft das flache, in der Pfanne gebackene Gericht, während „Pfannkuchen“ dort auch ein gefülltes Hefefeingebäck meinen kann. In anderen Regionen ist „Pfannkuchen“ die übliche Bezeichnung für das flache Gericht. Sprachgrenzen sind nicht scharf und verändern sich. Deshalb ist es riskant, eine bundesweit einheitliche Bedeutung für historische Zeiten anzunehmen. Regionale Wörter entstehen durch Dialekte, Sprachkontakt und Esskultur. In Rezepten hilft eine Beschreibung der Form und Zubereitung oft mehr als nur der Name. Bezeichnungen und typische Zubereitungen unterscheiden sich regional; eine einzelne Bezeichnung gilt nicht überall gleich."],["D37","Palatschinken","Kultur","Palatschinken sind dünne, in der Pfanne gebackene Teigfladen und besonders in Österreich sowie Teilen Mittel- und Südosteuropas verbreitet. Sie ähneln französischen Crêpes und deutschen dünnen Eierkuchen, unterscheiden sich aber je nach regionalem Rezept. Der Name hängt sprachgeschichtlich mit Bezeichnungen aus mehreren mittel- und südosteuropäischen Sprachen zusammen. Typische Füllungen sind beispielsweise Marmelade, Topfen, Nüsse oder herzhafte Zutaten. Es gibt nicht das eine verbindliche Palatschinkenrezept. Dicke, Eieranteil und Flüssigkeit variieren von Haushalt zu Haushalt. Solche Gerichte zeigen, wie ähnliche Pfannenteige in unterschiedlichen Küchen eigene Namen, Techniken und Serviertraditionen entwickelt haben. Bezeichnungen und typische Zubereitungen unterscheiden sich regional; eine einzelne Bezeichnung gilt nicht überall gleich."],["D38","Crêpes","Kultur","Crêpes sind sehr dünne französische Pfannkuchen. Der Teig wird dünn auf einer heißen Fläche verteilt, sodass eine große, flexible Scheibe entsteht. Klassische süße Crêpes basieren häufig auf Weizenmehl, Eiern und Milch, während bretonische herzhafte Galettes oft mit Buchweizen verbunden sind. Spezielle Crêpe-Platten erleichtern das gleichmäßige Ausstreichen, eine normale flache Pfanne funktioniert aber ebenfalls. Die dünne Form verlangt einen relativ flüssigen Teig und eine passende Temperatur. Crêpes können süß oder herzhaft gefüllt und gefaltet werden. Wie bei Eierkuchen existieren zahlreiche Varianten; regionale Tradition und individuelles Rezept sind wichtiger als eine einzige verbindliche Zutatenliste. Bezeichnungen und typische Zubereitungen unterscheiden sich regional; eine einzelne Bezeichnung gilt nicht überall gleich. Crêpes sind im Vergleich meist dünner als US-amerikanische Pancakes. Dünne Crêpes brauchen meist einen flüssigeren Teig."],["D39","Pancakes","Kultur","Im englischsprachigen Raum bezeichnet „pancake“ verschiedene Pfannkuchentypen. US-amerikanische Pancakes sind häufig kleiner und dicker als deutsche Eierkuchen und werden oft mit Backpulver gelockert. Britische Pancakes können dagegen deutlich dünner sein. Internationale Begriffe lassen sich deshalb nicht immer eins zu eins übersetzen. Dicke Pancakes brauchen andere Garzeiten als sehr dünne Eierkuchen, damit die Mitte ausreichend durchgart. Die Bläschen auf der Oberseite können ein Hinweis sein, dass die erste Seite weitgehend gesetzt ist, sind aber kein universeller Timer. Sirup, Butter oder Obst sind typische Beilagen, verändern jedoch die Nährwerte erheblich. Das Grundprinzip bleibt ein in der Pfanne gegarter Teig. Bezeichnungen und typische Zubereitungen unterscheiden sich regional; eine einzelne Bezeichnung gilt nicht überall gleich. US-amerikanische Pancakes sind im Vergleich meist dicker als Crêpes. Dicke Pancakes brauchen meist einen dickeren Teig."],["D40","Historische Pfannengerichte","Kultur","Flache Teige, die auf heißen Steinen, Platten oder in Pfannen gegart werden, sind in vielen Kulturen seit langer Zeit bekannt. Daraus folgt jedoch nicht, dass ein heutiges Eierkuchenrezept unverändert aus der Antike stammt. Zutaten, Mahltechnik, Pfannenmaterialien und Triebmittel haben sich historisch verändert. Moderne Eierkuchen sind Teil einer langen Familie ähnlicher Speisen, aber konkrete Herkunftsbehauptungen benötigen historische Quellen. Besonders problematisch sind präzise Erfindungsdaten ohne Beleg. Backpulver in seiner modernen Form gehört beispielsweise in die Industrie- und Haushaltsgeschichte des 19. Jahrhunderts. Küchengeschichte arbeitet deshalb mit Kochbüchern, Handelsquellen, Sprachgeschichte und archäologischen Befunden statt mit einzelnen Legenden. Bezeichnungen und typische Zubereitungen unterscheiden sich regional; eine einzelne Bezeichnung gilt nicht überall gleich."],["D41","Maillard-Reaktion","Küchenchemie","Beim Bräunen von Eierkuchen laufen mehrere chemische Prozesse ab. Besonders wichtig ist die Maillard-Reaktion zwischen bestimmten Zuckerarten und Aminoverbindungen bei erhöhter Temperatur. Sie erzeugt zahlreiche Aroma- und Farbstoffe. Daneben kann Zucker karamellisieren, wobei dafür andere Bedingungen gelten. Eine trockene, heiße Oberfläche bräunt stärker als eine nasse Oberfläche. Deshalb beeinflussen Pfannentemperatur, Teigfeuchte, Zucker- und Eiweißgehalt die Farbe. Dunkler ist nicht automatisch besser: Zu starke Hitze kann zu bitteren oder verbrannten Noten führen. Die Maillard-Reaktion ist kein einzelner Stoff und kein Gesundheitszusatz, sondern ein komplexes Netzwerk von Reaktionen beim Erhitzen von Lebensmitteln."],["D42","Warum die erste Portion anders wird","Fehleranalyse","Viele Menschen beobachten, dass der erste Eierkuchen anders gelingt als die folgenden. Ein Grund kann sein, dass Pfanne und Fettfilm zu Beginn noch nicht im stabilen Temperaturbereich sind. Außerdem verteilt sich Fett beim ersten Durchgang manchmal ungleichmäßig. Nach einer Portion ist die Oberfläche gleichmäßiger heiß und die benötigte Fettmenge lässt sich besser einschätzen. Das ist kein Naturgesetz: In einer gut vorgeheizten Pfanne kann auch der erste Eierkuchen gut gelingen. Hilfreich sind eine kurze Vorheizphase, ein kleiner Testtropfen und eine konstante Teigmenge. Muss der Herd nachregeln, kann sich das Ergebnis während einer ganzen Serie verändern. Pfannentemperatur, Fettfilm und Garzeit beeinflussen gemeinsam Bräunung und Anhaften."],["D43","Klumpen im Teig","Fehleranalyse","Klumpen entstehen, wenn trockenes Mehl nicht gleichmäßig mit Flüssigkeit benetzt wird. Sie lassen sich reduzieren, indem Flüssigkeit schrittweise eingerührt oder das Mehl gesiebt wird. Ein Schneebesen verteilt Mehlpartikel meist gut. Kleine verbleibende Klümpchen können sich während einer Ruhezeit teilweise auflösen, weil Mehl weiter Wasser aufnimmt. Sehr aggressives Mixen ist nicht immer nötig und kann bei Weizenteig die Glutenentwicklung verstärken. Eine andere Methode ist, zunächst einen dickeren, glatten Teig mit einem Teil der Flüssigkeit herzustellen und ihn anschließend zu verdünnen. Welche Technik am besten passt, hängt vom Rezept, der Mehlart und dem vorhandenen Werkzeug ab."],["D44","Teig zu dick oder zu dünn","Fehleranalyse","Ein zu dicker Eierkuchenteig fließt schlecht auseinander und ergibt eher dicke, kompakte Stücke. Meist lässt er sich mit kleinen Mengen Flüssigkeit verdünnen. Ein sehr dünner Teig kann beim Wenden empfindlich sein, besonders wenn wenig bindende Zutaten vorhanden sind. Dann hilft je nach Rezept etwas Mehl oder eine kurze Quellzeit. Korrekturen sollten schrittweise erfolgen, weil wenige Esslöffel die Konsistenz bereits deutlich verändern können. Vollkornmehl, Hafer und Samen binden mehr Wasser als manche hellen Mehle. Ein Rezept liefert deshalb nur einen Ausgangspunkt. Praktisch ist der Löffeltest: Der Teig soll für dünne Eierkuchen gleichmäßig vom Löffel fließen. Mehlmenge, Flüssigkeitsmenge und gewünschte Dicke bestimmen gemeinsam, wie gießfähig der Teig ist."],["D45","Eierkuchen für Kinder","Alltag","Eierkuchen können für Kinder eine vielseitige Mahlzeit sein, wenn Zutaten, Portionsgröße und Beläge altersgerecht gewählt werden. Obst, Naturjoghurt, Quark oder Gemüsefüllungen liefern andere Nährstoffe als sehr zuckerreiche Aufstriche. Ganze Nüsse können für kleine Kinder ein Verschluckungsrisiko darstellen; gemahlene Nüsse oder Nussmus sind je nach Alter und Allergiesituation eine andere Form. Roher Teig sollte auch von Kindern nicht probiert werden. Sehr heiße Pfannen und Fett bergen Verbrennungsgefahr, weshalb Kinder beim Kochen altersgerecht begleitet werden sollten. Ob ein konkretes Gericht zu besonderen Ernährungsbedürfnissen passt, hängt von Allergien, Erkrankungen und der gesamten Ernährung ab. Für Kinder lassen sich Eierkuchen mit Obststücken oder anderen geeigneten Zutaten dekorieren; kleine, gut greifbare Portionen sind oft praktisch."],["D46","Meal Prep","Alltag","Eierkuchen eignen sich für vorbereitete Mahlzeiten, wenn sie hygienisch gebacken, rasch abgekühlt und gekühlt oder eingefroren werden. Für Lunchboxen sind trockene Füllungen praktischer als sehr saftige, weil der Teig sonst schnell weich wird. Herzhafte Eierkuchen können gerollt und in Stücke geschnitten werden. Süße Varianten lassen sich mit Obst separat verpacken. Lebensmittel mit leicht verderblichen Zutaten sollten unterwegs ausreichend kühl gehalten werden. Wer mehrere Portionen vorbereitet, kann Teigmenge und Pfannengröße standardisieren, damit die Stücke ähnlich groß werden. Meal Prep verändert die grundlegenden Sicherheitsregeln nicht: saubere Hände, saubere Geräte, passende Kühlung und vollständiges Garen bleiben wichtig. Für Brunch, Picknick, Brotdose oder größere Gruppen eignen sich vorbereitete, gut gekühlte Portionen, wenn Füllung und Transport zur jeweiligen Situation passen. Hygiene, Temperatur und Lagerdauer beeinflussen gemeinsam Sicherheit und Qualität von Eierkuchen."],["D47","Resteverwertung","Alltag","Übrig gebliebene Eierkuchen müssen nicht sofort entsorgt werden, wenn sie sicher gelagert wurden. Sie können in Streifen geschnitten als Suppeneinlage dienen, gefüllt und überbacken oder kurz in der Pfanne erwärmt werden. Süße Reste passen zu Obst oder Quark. Herzhafte Varianten lassen sich mit Gemüse kombinieren. Bei der Resteverwertung ist wichtig, wie lange und bei welcher Temperatur die Eierkuchen gelagert wurden. Ein erneutes Erhitzen macht verdorbene Lebensmittel nicht automatisch wieder sicher. Auch Geruch und Aussehen liefern Hinweise, ersetzen aber nicht alle Hygieneregeln. Kleine Portionen und eine frühzeitige Planung helfen, Lebensmittelverschwendung von vornherein zu vermeiden. Mehrere dünne Eierkuchen können geschichtet als Eierkuchentorte aufgebaut oder gefüllt und im Ofen gratiniert werden. Als Suppeneinlage heißen in Streifen geschnittene Pfannkuchen regional unter anderem Flädle; in Österreich ist dafür auch Frittaten gebräuchlich. Hygiene, Temperatur und Lagerdauer beeinflussen gemeinsam Sicherheit und Qualität von Eierkuchen. Kühlen oder Einfrieren machen bereits verdorbene Lebensmittel nicht wieder sicher."],["D48","Pfannenmaterialien","Ausrüstung","Eierkuchen lassen sich in beschichteten, gusseisernen oder Edelstahlpfannen backen, doch jedes Material verhält sich anders. Antihaftbeschichtungen erleichtern das Lösen und benötigen oft weniger Fett, dürfen aber nicht mit ungeeigneten Metallwerkzeugen beschädigt werden. Gusseisen speichert viel Wärme und kann bei guter Einbrennung eine relativ glatte Oberfläche entwickeln. Edelstahl reagiert schnell auf Temperaturänderungen, verlangt aber etwas mehr Übung bei Hitze und Fett. Eine flache Pfanne erleichtert das Wenden dünner Eierkuchen. Wichtig ist, Herstellerhinweise zur maximalen Temperatur und Pflege zu beachten. Das Material allein garantiert kein gutes Ergebnis; Vorheizen, Fettfilm und Teigkonsistenz bleiben entscheidend. Pfannenmaterial, Herdleistung und Vorheizen beeinflussen gemeinsam, wie gleichmäßig die Wärme auf den Teig wirkt."],["D49","Induktion, Gas, Elektro","Ausrüstung","Herdarten übertragen Wärme unterschiedlich. Gas reagiert sehr direkt auf Änderungen der Flamme. Klassische Elektroplatten speichern länger Wärme, während Induktion geeignete magnetische Pfannen sehr schnell erhitzen kann. Die Zahlen am Regler sind deshalb zwischen Herden nicht vergleichbar. Für Eierkuchen ist eine gleichmäßige Pfannentemperatur wichtiger als eine bestimmte Stufe. Wer einen neuen Herd benutzt, sollte mit mittlerer Leistung beginnen und anhand von Bräunung und Garzeit nachregeln. Bei Induktion kann besonders hohe Leistung eine leere Pfanne sehr schnell überhitzen. Ein kleiner Probeteig ist sicherer als starres Festhalten an einer Zahl aus einem fremden Rezept. Pfannenmaterial, Herdleistung und Vorheizen beeinflussen gemeinsam, wie gleichmäßig die Wärme auf den Teig wirkt."],["D50","Eierkuchen kreativ würzen","Ideen","Ein neutraler Eierkuchenteig lässt sich in viele Richtungen aromatisieren. Für süße Varianten eignen sich beispielsweise Vanille, Zimt, Zitronen- oder Orangenschale und Kakao. Für herzhafte Versionen kommen Pfeffer, Muskat, Paprika, Kreuzkümmel, Schnittlauch, Petersilie oder andere Kräuter infrage. Gewürze verändern Geschmack, aber nicht automatisch die Grundstruktur des Teigs. Stark wasserhaltige Zutaten wie geriebenes Gemüse sollten so dosiert werden, dass der Teig nicht unkontrolliert verdünnt. Käse oder salzige Füllungen können die benötigte Salzmenge im Grundteig reduzieren. Sinnvoll ist, neue Kombinationen zunächst mit einer kleinen Teigportion zu testen und danach nach Geschmack anzupassen. Kleine Mengen Mohn, Kokosraspeln oder gemahlene Nüsse können süße Teige aromatisieren und zugleich die Konsistenz verändern, weil trockene Zutaten Flüssigkeit aufnehmen oder Fett mitbringen. Aromatische Zutaten verändern vor allem den Geschmack und können je nach Menge auch die Teigkonsistenz beeinflussen."],["D51","Grundzutaten klassischer Eierkuchen","Grundlagen","Ein klassischer Eierkuchenteig verbindet meist Mehl, Eier, eine Flüssigkeit wie Milch oder Wasser und etwas Salz. Mehl liefert Stärke und bei Weizen auch glutenbildende Proteine, Eier stabilisieren den Teig beim Erhitzen, und die Flüssigkeit stellt die gießfähige Konsistenz her. Fett kann im Teig oder nur in der Pfanne eingesetzt werden. Zucker ist für herzhafte oder neutrale Eierkuchen nicht notwendig. Entscheidend ist das Verhältnis der Zutaten zueinander: mehr Mehl macht den Teig dicker, mehr Flüssigkeit dünner. Beim Backen wirken Teigdicke, Pfannentemperatur, Fettfilm und Backdauer gemeinsam auf Bräunung, Feuchtigkeit und Elastizität. Mehlmenge, Flüssigkeitsmenge und gewünschte Dicke bestimmen gemeinsam, wie gießfähig der Teig ist."],["D52","Funktion von Eiern im Eierkuchenteig","Zutaten","Eier beeinflussen Eierkuchenteig auf mehreren Wegen. Ihre Proteine gerinnen beim Erhitzen und tragen dazu bei, dass der zunächst flüssige Teig fest wird. Eigelb enthält Fett und Emulgatoren, die Fett und Wasser im Teig besser verteilen können. Eier bringen außerdem Farbe, Geschmack und Wasser mit. Mehr Ei verändert daher nicht nur den Proteingehalt, sondern auch Textur und Aroma. Für sehr dünne Eierkuchen ist eine ausreichende Bindung hilfreich, doch ein hoher Eieranteil ist keine Garantie für ein zartes Ergebnis. Bei eifreien Varianten müssen Bindung, Feuchtigkeit und Bräunung durch andere Zutaten und die Rezeptur ausgeglichen werden. Mehr Ei kann die Proteinmenge im Teig erhöhen. Mehr Ei kann den Eiergeschmack verstärken."],["D53","Funktion von Mehl im Eierkuchenteig","Mehl","Mehl liefert einen großen Teil der Stärke im Eierkuchenteig. Beim Erhitzen nimmt Stärke Wasser auf, quillt und trägt zur Festigung der Krume bei. Weizen- und Dinkelmehl enthalten außerdem glutenbildende Proteine. Mit Wasser und Bewegung kann daraus ein elastisches Klebergerüst entstehen, das den Teig zusammenhält. Zu viel Mehl im Verhältnis zur Flüssigkeit führt häufig zu einem dickeren, kompakteren Eierkuchen. Sehr intensives Rühren kann bei Weizenteigen zusätzlich die Glutenentwicklung fördern. Mehlsorten unterscheiden sich in Wasseraufnahme, Ausmahlungsgrad, Eigengeschmack und Proteingehalt, weshalb die gleiche Flüssigkeitsmenge nicht bei jedem Mehl dieselbe Konsistenz ergibt. Mehlmenge, Flüssigkeitsmenge und gewünschte Dicke bestimmen gemeinsam, wie gießfähig der Teig ist. Mehlmenge, Flüssigkeit und Rührintensität beeinflussen gemeinsam die Stärke der Teigstruktur. Weizen- und Dinkelmehl können Gluten bilden; sehr kräftiges Rühren kann dünne Eierkuchen zäher machen. Mehr Mehl kann den Teig dicker machen. Mehr Mehl kann den Teig kompakter machen. Eine größere Menge Mehl kann den Teig dicker machen."],["D54","Funktion von Milch im Eierkuchenteig","Zutaten","Milch liefert dem Eierkuchenteig vor allem Flüssigkeit, aber auch Milchprotein, Milchzucker und etwas Fett. Die Flüssigkeit verteilt Mehlbestandteile und bestimmt zusammen mit der Mehlmenge, wie gut der Teig in der Pfanne zerläuft. Milchprotein und Milchzucker können die Bräunung und den Geschmack beeinflussen. Vollmilch, fettarme Milch und laktosefreie Milch verhalten sich ähnlich, unterscheiden sich aber etwas in Geschmack und Zusammensetzung. Pflanzendrinks können Milch oft ersetzen, bringen jedoch andere Eiweiß-, Zucker- und Fettmengen mit. Deshalb sollte die Konsistenz des fertigen Teigs kontrolliert werden, statt die Flüssigkeitsmenge völlig unabhängig vom verwendeten Produkt zu betrachten. Art und Menge der Flüssigkeit beeinflussen, wie dünn der Teig ist und wie gut er in der Pfanne zerläuft. Milch und Pflanzendrinks lassen sich in vielen Rezepten austauschen, verhalten sich aber nicht völlig identisch. Mehr Milch kann die Menge an Milchprotein im Teig erhöhen. Eine größere Milchmenge kann den Teig dünner machen."],["D55","Funktion von Wasser im Eierkuchenteig","Zutaten","Wasser ist der wichtigste flüssige Bestandteil vieler Teigzutaten und beeinflusst unmittelbar die Viskosität des Eierkuchenteigs. Es hydratisiert Stärke und Proteine im Mehl, ermöglicht die Glutenbildung bei Weizen und verdampft beim Backen teilweise. Wasserdampf kann zur Lockerung beitragen, besonders bei dünnen Teigen und hoher Oberflächentemperatur. Reines Wasser liefert weder Fett noch Protein und schmeckt neutral. Wird Milch teilweise durch Wasser ersetzt, verändert sich daher nicht nur die Flüssigkeitsmenge, sondern auch die Menge an Milchprotein, Milchzucker und Fett. Ein sehr wasserreicher Teig verteilt sich leichter, kann aber empfindlicher werden, wenn die bindenden Bestandteile nicht ausreichen. Art und Menge der Flüssigkeit beeinflussen, wie dünn der Teig ist und wie gut er in der Pfanne zerläuft. Mehr Wasser kann die Proteinmenge im Teig nicht erhöhen. Mehr Wasser kann den Teig dünner machen. Mehr Wasser kann die Bräunung zunächst verlangsamen."],["D56","Wirkung von Salz im Eierkuchenteig","Zutaten","Salz wird in Eierkuchenteig meist in kleiner Menge eingesetzt und dient vor allem der Geschmacksabrundung. Es liefert kein Fett und keine Lockerung. In Weizenteigen kann Salz die Wechselwirkungen im Glutennetz beeinflussen, doch die üblichen kleinen Mengen im Eierkuchenteig verändern die Struktur weniger stark als Mehlmenge, Flüssigkeit und Rührintensität. Zu viel Salz macht sowohl süße als auch herzhafte Eierkuchen unangenehm salzig. Wird mit sehr salzigen Füllungen oder Käse gearbeitet, kann die Salzmenge im Grundteig reduziert werden. Salz verändert den Rauchpunkt von Butter nicht um einen festen, verlässlichen Temperaturwert. Mehr Salz kann den Teig salziger machen."],["D57","Wirkung von Zucker im Eierkuchenteig","Zutaten","Zucker süßt den Teig und kann die Bräunung fördern. Er bindet Wasser und kann dadurch die Wahrnehmung von Feuchtigkeit und Zartheit verändern. Bei hoher Hitze kann Zucker an Karamellisierungsreaktionen beteiligt sein; zugleich tragen reduzierende Zucker zusammen mit Aminoverbindungen zur Maillard-Reaktion bei. Zu viel Zucker lässt dünne Eierkuchen leichter dunkel werden, bevor die Mitte passend gegart ist. Für herzhafte Eierkuchen ist zugesetzter Zucker nicht notwendig. Süße lässt sich auch über Beläge steuern. Die Gesamtwirkung hängt von Zuckermenge, Teigdicke, Pfannentemperatur und Backzeit ab, nicht von einer einzelnen universellen Dosierung. Mehr Zucker kann den Teig süßer machen. Mehr Zucker kann die Bräunung verstärken. Mehr Zucker kann den Geschmack süßer machen."],["D58","Wirkung von Butter beim Braten","Zutaten","Butter liefert beim Braten ein charakteristisches Aroma und unterstützt die Wärmeübertragung zwischen Pfanne und Teig. Sie enthält neben Milchfett auch Wasser und Milchbestandteile. Diese Bestandteile können bei höherer Hitze bräunen und schließlich verbrennen. Deshalb eignet sich Butter gut für moderates Braten, während Butterschmalz bei stärkerer Hitze robuster ist. Ein dünner Fettfilm reicht bei vielen Pfannen aus; sehr große Mengen sind für dünne Eierkuchen nicht nötig. Ob ein Eierkuchen klebt, hängt außerdem von Pfannenoberfläche, Vorheizen, Teigzusammensetzung und Zeitpunkt des Wendens ab. Butter allein kann diese Faktoren nicht vollständig ausgleichen. Pfannentemperatur, Fettfilm und Garzeit beeinflussen gemeinsam Bräunung und Anhaften. Mehr Butter kann den Buttergeschmack verstärken. Mehr Butter kann das Butteraroma verstärken."],["D59","Wirkung von Pflanzenöl beim Braten","Zutaten","Neutrale Pflanzenöle können zum Ausbacken von Eierkuchen verwendet werden. Sie bilden einen dünnen Fettfilm, verbessern den Kontakt zur heißen Pfanne und verringern bei geeigneter Oberfläche das Anhaften. Verschiedene Öle unterscheiden sich in Geschmack und Hitzestabilität. Für höhere Temperaturen sollte ein dafür geeignetes raffiniertes Öl verwendet werden. Mehr Öl macht das Gericht energiereicher und verhindert nicht automatisch Trockenheit, wenn der Eierkuchen zu lange gebacken wird. Wie viel Öl tatsächlich aufgenommen wird, hängt von Teig, Temperatur, Pfanne und eingesetzter Menge ab. Bei einer intakten Antihaftpfanne genügt häufig eine sehr kleine Fettmenge. Pfannentemperatur, Fettfilm und Garzeit beeinflussen gemeinsam Bräunung und Anhaften. Mehr neutrales Pflanzenöl kann den Buttergeschmack nicht verstärken. Mehr neutrales Öl kann das Butteraroma nicht verstärken."],["D60","Konsistenz von Eierkuchenteig","Technik","Die Konsistenz des Teigs bestimmt, wie schnell er sich in der Pfanne verteilt und wie dick der fertige Eierkuchen wird. Für dünne Eierkuchen ist ein gleichmäßig gießfähiger Teig sinnvoll; für dickere Varianten darf er zäher sein. Zu viel Mehl oder stark quellende Zutaten machen den Teig fester, zusätzliche Flüssigkeit macht ihn dünner. Während einer Ruhezeit können Mehl, Hafer oder Samen weiter Wasser aufnehmen, sodass sich die Konsistenz verändert. Korrekturen sollten deshalb schrittweise erfolgen. Ein einfacher Löffel- oder Schöpfkellentest ist oft nützlicher als eine starre Milliliterangabe, weil Mehlsorte, Eiergröße und weitere Zutaten die Wasserbindung verändern. Mehlmenge, Flüssigkeitsmenge und gewünschte Dicke bestimmen gemeinsam, wie gießfähig der Teig ist. Eine größere Menge Flüssigkeit kann den Teig dünner machen."],["D61","Ruhezeit von Eierkuchenteig","Technik","Eine kurze Ruhezeit kann Eierkuchenteig gleichmäßiger machen. Mehlbestandteile nehmen weiter Wasser auf, kleine Klümpchen kön
